<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>레퍼런스 아카이브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 좌측 태그 필터 레일 + 우측 스프레드시트형 레퍼런스 표. 확장 시스템/PC 도구 칩은 호버 시 공략 노트 팝오버 */
:root{
  --bg:#f3f4f6; --panel:#ffffff; --ink:#16181d; --muted:#5f6573; --line:#dde0e6; --hover:#eef0f4;
  --accent:#d9480f; --accent-ink:#ffffff;
  --t-theme:#6741d9; --t-theme-bg:#efeafe;
  --t-look:#0b7285;  --t-look-bg:#e3f4f6;
  --t-weapon:#a61e4d;--t-weapon-bg:#fce8ef;
  --t-sys:#b35900;   --t-sys-bg:#fff1dc;
  --t-pc:#1864ab;    --t-pc-bg:#e3eefb;
  --t-game:#343a40;  --t-game-bg:#e9ecef;
  --t-ver:#495057;   --t-ver-bg:#f1f3f5;
  --t-level:#2b8a3e; --t-level-bg:#e6f4ea;
  --t-hook:#c2255c;  --t-hook-bg:#ffe8f0;
  --shadow:0 12px 32px rgba(20,24,33,.16);
  --ok:#1e7a34; --ok-bg:#e6f4ea;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121418; --panel:#1a1d23; --ink:#e8eaee; --muted:#9aa1ae; --line:#2b3039; --hover:#22262e;
  --accent:#ff7a3d; --accent-ink:#1a0d05;
  --t-theme:#b9a3ff; --t-theme-bg:#2a2340;
  --t-look:#66d3e0;  --t-look-bg:#15323a;
  --t-weapon:#ff8fb1;--t-weapon-bg:#3a1a26;
  --t-sys:#ffb35c;   --t-sys-bg:#3a2a14;
  --t-pc:#74b4ff;    --t-pc-bg:#172a42;
  --t-game:#ced4da;  --t-game-bg:#2a2e35;
  --t-ver:#ced4da;   --t-ver-bg:#262a31;
  --t-level:#8ce99a; --t-level-bg:#183222;
  --t-hook:#faa2c1;  --t-hook-bg:#3a1a28;
  --shadow:0 12px 32px rgba(0,0,0,.5); --ok:#6ad08a; --ok-bg:#15301f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121418; --panel:#1a1d23; --ink:#e8eaee; --muted:#9aa1ae; --line:#2b3039; --hover:#22262e;
  --accent:#ff7a3d; --accent-ink:#1a0d05;
  --t-theme:#b9a3ff; --t-theme-bg:#2a2340;
  --t-look:#66d3e0;  --t-look-bg:#15323a;
  --t-weapon:#ff8fb1;--t-weapon-bg:#3a1a26;
  --t-sys:#ffb35c;   --t-sys-bg:#3a2a14;
  --t-pc:#74b4ff;    --t-pc-bg:#172a42;
  --t-game:#ced4da;  --t-game-bg:#2a2e35;
  --t-ver:#ced4da;   --t-ver-bg:#262a31;
  --t-level:#8ce99a; --t-level-bg:#183222;
  --t-hook:#faa2c1;  --t-hook-bg:#3a1a28;
  --shadow:0 12px 32px rgba(0,0,0,.5); --ok:#6ad08a; --ok-bg:#15301f; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1480px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.ttl{display:flex;flex-direction:column;gap:2px}
.ttl .eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ttl h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 12px;font-weight:500}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--t-weapon)}
.btn.sm{padding:4px 9px;font-size:12px}
.mode{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:0 4px}
.mode i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.mode.cloud i{background:#2f9e44}
.mode.warn i{background:var(--accent)}
.ro #popEdit,.ro .edit-only{display:none!important}

.searchbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sortbox{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.sortbox select{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 10px;font-weight:500}
th.grip,td.grip{display:none;width:34px;padding-left:8px;padding-right:0}
.sort-manual th.grip,.sort-manual td.grip{display:table-cell}
td.grip .g{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted)}
td.grip .h{cursor:grab;font-size:16px;line-height:1;padding:2px;user-select:none}
td.grip button{border:0;background:none;color:var(--muted);font-size:10px;padding:1px 4px;border-radius:3px;line-height:1.2}
td.grip button:hover{background:var(--line);color:var(--ink)}
td.grip button:disabled{opacity:.25}
tr.dragging{opacity:.4}
tr.drop-before td{box-shadow:inset 0 2px 0 var(--accent)}
tr.drop-after td{box-shadow:inset 0 -2px 0 var(--accent)}
.manual-hint{font-size:12px;color:var(--muted)}
.pop .crumb .en{font-weight:500;color:var(--muted)}
.pop .pen{display:flex;gap:8px;padding:10px 12px 0}
.pop .pen input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 9px;font-size:13px}
.pop .shared{font-size:11.5px;color:var(--muted);padding:8px 12px 0}
.srlink{margin:10px 12px 0;border:1px solid var(--t-sys);background:var(--t-sys-bg);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.srlink .top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.srlink .top span{font-size:11px;font-weight:700;color:var(--t-sys)}
.srlink .top small{color:var(--muted)}
.srlink .top .btn{margin-left:auto}
.srlink .par{color:var(--t-sys);font-weight:600}
.srlink .sum{color:var(--ink);line-height:1.55}
td.name .usechip{display:inline-flex;gap:4px;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:1px 9px;font-size:11.5px;font-weight:600;color:var(--muted);margin:0 6px 6px 0;cursor:pointer}
td.name .usechip:hover{color:var(--ink);border-color:var(--ink)}
.tag.linked{text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer}
.gsec>header .en{font-size:13px;color:var(--muted);font-weight:500}
.gshared{padding:12px 14px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.gshared .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gshared .top .lbl{font-family:var(--f-mono);font-size:11.5px;border:1px solid var(--line);border-radius:4px;padding:0 6px;color:var(--muted)}
.gshared .top small{color:var(--muted);font-size:12px}
.gitem.slim{grid-template-columns:64px minmax(0,1fr) auto;align-items:center}
.gitem.slim .thumb{width:64px;height:64px}
.ac button .en{color:var(--muted);font-size:12px;margin-left:6px}
/* 이전 값 고르기 (칩) */
.pick{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
select.gamesel{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:8px 10px;font-weight:500}
.pick .tag{cursor:pointer;font-size:12px}
.pick .tag.on::before{content:"✓";font-size:10px;margin-right:2px}
.pick .pmore{border:1px dashed var(--line);background:none;border-radius:4px;padding:1px 8px;font-size:12px;color:var(--muted)}
.pick .pmore:hover{color:var(--ink);border-color:var(--ink)}
/* 공략 */
td.guide{min-width:150px;max-width:220px}
.gpv{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 8px;font-size:12.5px;line-height:1.55;color:var(--ink);cursor:pointer}
.gpv:hover{border-color:var(--accent)}
.gpv span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line;word-break:keep-all}
.gpv small{display:block;margin-top:4px;color:var(--accent);font-weight:600;font-size:11.5px}
.guidedoc{padding:18px 22px;max-height:65vh;overflow:auto}
.guidedoc .doc{font-size:15px;line-height:1.85}
/* 확장 구조 */
.trbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.trbar select{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:7px 10px;font-weight:600;max-width:100%}
.trbar .note{font-size:12px;color:var(--muted)}
.trwrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:calc(100vh - 220px);min-height:200px}
.tree{position:relative}
.tree svg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.tree path{fill:none;stroke:var(--muted);stroke-opacity:.55;stroke-width:1.6;transition:opacity .12s}
.tree path.back{stroke-dasharray:4 4}
.tree path.hl{stroke:var(--accent);stroke-opacity:1;stroke-width:2.4}
.tgame{position:absolute;font-size:12px;font-weight:700;color:var(--ink);background:var(--hover);border-radius:4px;padding:2px 8px;white-space:nowrap}
.tlay{position:absolute;top:10px;font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.tnode{position:absolute;height:82px;border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:6px 10px;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:1px;overflow:hidden;cursor:pointer;color:var(--ink);transition:opacity .12s,border-color .12s}
.tnode:hover,.tnode:focus-visible{border-color:var(--accent)}
.tnode b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tnode b small{font-weight:500;color:var(--muted);font-size:11px;margin-left:5px}
.tnode .kw{font-size:11px;color:var(--t-theme);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tnode .ext{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tnode .multi{font-size:11px;color:var(--t-sys);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tnode.root{box-shadow:inset 3px 0 0 var(--t-sys)}
.tnode.ghost{border-style:dashed;background:var(--bg);color:var(--muted)}
.tree.dim .tnode:not(.hl){opacity:.25}
.tree.dim path:not(.hl){opacity:.12}
.tree .tnode.hl{border-color:var(--accent)}
.tlonely{display:flex;flex-direction:column;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tlonely .cell{display:flex;flex-wrap:wrap;gap:5px}
.tlonely small{color:var(--muted);font-size:12px}
td.name .par{display:block;font-size:12px;color:var(--t-sys);margin:-2px 0 6px;font-weight:600}
td.name .ext{display:block;font-size:12px;color:var(--muted);margin:-2px 0 6px}
td.name .sim{display:block;font-size:12px;color:var(--t-theme);margin:-2px 0 6px}
.ppick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.ppick:empty{display:none}
.ppick .tag{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;padding:2px 4px 2px 9px}
.ppick .tag.miss{border-style:dashed}
.ppick .tag button{border:0;background:none;color:inherit;font-size:13px;line-height:1;padding:0 4px;border-radius:3px;cursor:pointer}
.ppick .tag button:hover{background:var(--c-bg)}
.gsub{display:flex;align-items:center;gap:8px;padding:10px 14px 6px;border-bottom:1px solid var(--line);background:var(--bg)}
.gsub .cnt{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.gitem.kid{background:var(--bg)}
.sgt{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:1px 9px;font-size:11.5px;font-weight:600;color:var(--muted);margin:0 0 6px;cursor:pointer}
.sgt:hover{color:var(--ink);border-color:var(--ink)}
.sgt.open{color:var(--t-sys);border-color:var(--t-sys)}
tr.sub td{background:color-mix(in srgb, var(--bg) 55%, transparent)}
tr.sub td.name .nm::before{content:"└ ";color:var(--muted);font-weight:400}
.tree path.sim{stroke:var(--t-theme);stroke-dasharray:3 5;stroke-opacity:.8}
.sysgrp{display:none}
.v-sysl .sysgrp{display:inline-flex}
/* 패치 타임라인 */
.tlbar-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tlbar-top select{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:7px 10px;font-weight:600}
.tlbar-top .note{font-size:12.5px;color:var(--muted)}
.tlbar-top .lg{display:flex;gap:10px;margin-left:auto;font-size:12px;color:var(--muted);flex-wrap:wrap}
.tlbar-top .lg i{display:inline-block;width:14px;height:8px;border-radius:3px;margin-right:4px;vertical-align:middle;background:var(--c-bg);border:1px solid var(--c)}
.tlwrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
.tl{--cw:76px;min-width:calc(210px + var(--n) * var(--cw))}
.tlrow{display:grid;grid-template-columns:210px minmax(0,1fr);border-bottom:1px solid var(--line)}
.tlrow:last-child{border-bottom:0}
.tln{position:sticky;left:0;z-index:2;background:var(--panel);padding:8px 12px;display:flex;flex-direction:column;justify-content:center;gap:2px;border-right:1px solid var(--line);min-width:0}
.tln b{font-size:13.5px;word-break:keep-all}
.tln small{font-size:11.5px;color:var(--muted)}
.tlt{display:grid;grid-template-columns:repeat(var(--n),minmax(var(--cw),1fr));grid-template-rows:minmax(40px,auto);position:relative}
.tlc{grid-row:1;border-left:1px dashed var(--line)}
.tlc:first-child{border-left:0}
.tlc.cur{background:var(--hover)}
.tlbar{grid-row:1;z-index:1;align-self:center;margin:6px 4px;min-height:26px;border-radius:6px;border:1px solid var(--c);background:var(--c-bg);color:var(--c);font-size:12px;font-weight:600;padding:3px 8px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
.tlbar:hover{filter:brightness(.97);box-shadow:0 0 0 2px var(--c-bg)}
.tlbar .dots{display:flex;gap:3px;margin-left:auto}
.tlbar.mon{--c:var(--accent);--c-bg:var(--hover);color:var(--ink);font-weight:600}
.tlbar.mon img,.tlbar.mon video{width:22px;height:22px;border-radius:4px;object-fit:cover;flex:none}
.tlhead .tln{font-size:12px;color:var(--muted);font-weight:600}
.tlhead .tlt{grid-template-rows:auto}
.tlv{grid-row:1;padding:8px 6px;text-align:center;display:flex;flex-direction:column;gap:1px;border-left:1px solid var(--line)}
.tlv:first-child{border-left:0}
.tlv b{font-size:13px;font-variant-numeric:tabular-nums}
.tlv span{font-size:11px;color:var(--muted)}
.tlsec{position:sticky;left:0;padding:8px 12px;font-size:12px;font-weight:700;color:var(--muted);background:var(--bg);border-bottom:1px solid var(--line)}
.search{flex:1 1 320px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:0 12px}
.search svg{flex:none;color:var(--muted)}
.search input{border:0;background:transparent;padding:10px 0;width:100%;outline:none}
.active-filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.active-filters .lbl{font-size:12px;color:var(--muted)}
.count{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.main{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.main{grid-template-columns:minmax(0,1fr)}}

.side{display:flex;flex-direction:column;gap:12px;position:sticky;top:max(12px,env(safe-area-inset-top,0px));max-height:calc(100vh - 24px);min-width:0}
.rail{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:16px;overflow:auto;min-height:0}
.content{display:flex;flex-direction:column;gap:12px;min-width:0}
@media (max-width:860px){.side{position:static;max-height:none}}
.group h3{margin:0 0 8px;font-size:12px;font-family:var(--f-body);color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.group h3 i{width:8px;height:8px;border-radius:2px;display:inline-block}
.group .chips{display:flex;flex-wrap:wrap;gap:5px}
.empty-note{font-size:12px;color:var(--muted)}

.tag{display:inline-flex;align-items:center;gap:4px;border:1px solid transparent;border-radius:4px;padding:1px 7px;font-size:12px;line-height:1.6;white-space:nowrap;background:var(--c-bg);color:var(--c)}
button.tag:hover{border-color:var(--c)}
.tag.on{background:var(--c);color:var(--panel)}
.tag .n{font-family:var(--f-mono);font-size:10.5px;opacity:.75;font-variant-numeric:tabular-nums}
.tag .x{font-size:13px;line-height:1}
.c-theme{--c:var(--t-theme);--c-bg:var(--t-theme-bg)}
.c-look{--c:var(--t-look);--c-bg:var(--t-look-bg)}
.c-weapon{--c:var(--t-weapon);--c-bg:var(--t-weapon-bg)}
.c-ver{--c:var(--t-ver);--c-bg:var(--t-ver-bg)}
.c-level{--c:var(--t-level);--c-bg:var(--t-level-bg)}
.c-hook{--c:var(--t-hook);--c-bg:var(--t-hook-bg)}
.c-sys{--c:var(--t-sys);--c-bg:var(--t-sys-bg)}
.c-pc{--c:var(--t-pc);--c-bg:var(--t-pc-bg)}
.c-game{--c:var(--t-game);--c-bg:var(--t-game-bg)}

/* 상세 노트를 가진 칩: 점선 밑줄 + 노트 표시 점 */
.deep{border:1px dashed var(--c);font-weight:600;cursor:help}
.deep.has::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--c);margin-left:2px}

.tablebox{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;min-width:1040px}
th,td{text-align:left;vertical-align:top;padding:10px 10px;border-bottom:1px solid var(--line)}
th{font-size:12px;font-family:var(--f-body);color:var(--muted);font-weight:600;background:var(--panel);position:sticky;top:0;white-space:nowrap}
tbody tr:hover{background:var(--hover)}
tbody tr:last-child td{border-bottom:0}
td .cell{display:flex;flex-wrap:wrap;gap:4px}
td.game{white-space:nowrap;color:var(--muted);font-size:13px}
td.name{min-width:150px;max-width:220px}
td.name .nm{font-weight:700;font-size:14.5px;display:block;margin-bottom:6px;word-break:keep-all}
td.name .en{display:block;margin:-4px 0 6px;font-size:12.5px;color:var(--muted);font-weight:500;word-break:break-word}
.gcrumb .en{font-size:12.5px;color:var(--muted)}
td.name .cell{margin-bottom:6px}
td .cell .tag{white-space:normal;word-break:keep-all}

.groupbox{display:flex;flex-direction:column;gap:14px;min-width:0}

.gsec>header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}

@media (max-width:560px){.gitem{grid-template-columns:64px minmax(0,1fr)}.gitem .gact{grid-column:2}.gitem .thumb{width:64px;height:64px}}

.gcrumb b{color:var(--ink);font-size:14px}
.gcrumb .lbl{font-family:var(--f-mono);font-size:11.5px;border:1px solid var(--line);border-radius:4px;padding:0 6px}
.gnote{white-space:pre-wrap;font-size:13.5px;line-height:1.65}
.gnote.blank{color:var(--muted);font-style:italic}
.gedit{display:flex;flex-direction:column;gap:8px}
.gedit input,.gedit textarea{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 10px;width:100%}

.gedit .row{display:flex;gap:6px;justify-content:flex-end}
/* 자동완성 */
.ac{position:fixed;z-index:65;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:4px;max-height:260px;overflow:auto;display:flex;flex-direction:column}
.ac button{display:flex;justify-content:space-between;gap:12px;align-items:center;text-align:left;border:0;background:transparent;border-radius:5px;padding:7px 10px;font-size:13.5px}
.ac button.on,.ac button:hover{background:var(--hover)}
.ac button mark{background:transparent;color:var(--accent);font-weight:700}
.ac button .n{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.ac .hint{font-size:11px;color:var(--muted);padding:4px 10px 2px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:6px;font-size:13px;z-index:80}
@media (prefers-reduced-motion:no-preference){.pop,.modal{animation:in .14s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}}}

<script>
(() => {
const CATS = [
  {key:"game",   label:"게임",            cls:"c-game"},
  {key:"version",label:"버전",            cls:"c-ver"},
  {key:"theme",  label:"테마",            cls:"c-theme"},
  {key:"levels", label:"레벨 테마",        cls:"c-level"},
  {key:"hooks",  label:"후킹 이미지",      cls:"c-hook"},
  {key:"looks",  label:"외형",            cls:"c-look"},
  {key:"weapons",label:"무기",            cls:"c-weapon"},
  {key:"systems",label:"전투 확장 시스템", cls:"c-sys", deep:true, root:"몬스터 전투 확장 시스템"},
  {key:"pcs",    label:"대응 PC 도구",     cls:"c-pc",  deep:true, root:"대응 PC 도구"},
  {key:"cats",    label:"분류",            cls:"c-pc"},
  {key:"keywords",label:"키워드",          cls:"c-theme"},
];
const CAT = Object.fromEntries(CATS.map(c=>[c.key,c]));
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const splitTags = s => String(s||"").split(/[\/,·]/).map(t=>t.trim()).filter(Boolean);

const STORE_KEY = "monster-ref-v1";
const MAX_ANIM_KB = 700; /* Firestore 문서 1MB 제한 안에 들도록 */
const SEED = [{id:"zzz-primordial-nightmare",game:"젠레스 존 제로",name:"태초의 악몽",
  theme:["변이","비행기","빠름","에너지"],looks:["인간형","여성","건담"],weapons:["에너지","검"],
  systems:[{name:"제어기",label:"공략",note:"극한 회피 또는 극한 지원을 시전하여 제어기를 피해 회피\n- N회 성공 시 피해량을 줌\n- 이때 유저는 궁극기를 사용 못함\n- 태그 게이지를 무한으로 사용 가능"}],
  pcs:[{name:"엽빛나",label:"공략",note:""}],link:"",image:"",createdAt:1793786300000,updatedAt:1793786300000}];
const uid = () => "m" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function persist(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(allRefs)); return true; }
  catch(e){ toast("브라우저 저장 공간이 가득 찼어요. 내보내기로 백업한 뒤 이미지를 줄여 주세요"); return false; }
}
function commit(next){
  const prev = allRefs;
  allRefs = next.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  if(!persist()){ allRefs = prev; throw new Error("quota"); }
  syncKind();
  render();
  if(popKey && !editing){ drawPop(false); place(); }
}
/* ---------- 저장소: Firebase 설정이 있으면 클라우드, 없으면 이 브라우저 ---------- */
const CFG = window.REF_CONFIG || {};
const EDITORS = (CFG.editors||[]).map(e=>String(e).trim().toLowerCase()).filter(e=>e && !e.includes("본인"));
let mode = "local", fs = null, auth = null, user = null;
const COL = () => fs.collection("monsters");
const clean = d => { const o={...d}; delete o.id; return o; };
function fbConfigured(){ const f=CFG.firebase; return !!(f && f.apiKey && f.projectId && !/붙여|여기/.test(f.apiKey)); }
function canEdit(){
  if (mode==="local") return true;
  if (!user) return false;
  return !EDITORS.length || EDITORS.includes((user.email||"").toLowerCase());
}
const store = {
  async update(id, patch){ if(mode==="cloud") return COL().doc(id).update(patch); commit(allRefs.map(m=>m.id===id?{...m,...patch}:m)); },
  async set(id, data){ if(mode==="cloud") return COL().doc(id).set(clean(data)); commit(allRefs.filter(m=>m.id!==id).concat({...data,id})); },
  async add(data){ const id=uid(); if(mode==="cloud") return COL().doc(id).set(clean(data)); commit(allRefs.concat({...data,id})); },
  async remove(id){ if(mode==="cloud") return COL().doc(id).delete(); commit(allRefs.filter(m=>m.id!==id)); },
  async bulk(arr){
    if(mode==="cloud"){
      for(let i=0;i<arr.length;i+=20){ const b=fs.batch(); arr.slice(i,i+20).forEach(m=>b.set(COL().doc(m.id),clean(m))); await b.commit(); }
      return;
    }
    const byId=new Map(allRefs.map(m=>[m.id,m])); arr.forEach(m=>byId.set(m.id,m)); commit([...byId.values()]);
  },
};
function errMsg(ex){
  const c=ex&&ex.code||"";
  if(c==="permission-denied") return "수정 권한이 없어요. 관리자 계정으로 로그인해 주세요";
  if(c==="invalid-argument"||/size|large/i.test(ex&&ex.message||"")) return "데이터가 너무 커요. 이미지를 더 작은 것으로 바꿔 주세요";
  if(c==="unavailable") return "인터넷 연결을 확인해 주세요";
  if(ex&&ex.message==="quota") return "브라우저 저장 공간이 가득 찼어요";
  return "저장하지 못했어요. 다시 시도해 주세요";
}
function applyMode(){
  document.body.classList.toggle("ro", !canEdit());
  const m=$("#mode"), a=$("#authBtn");
  if(mode==="cloud"){
    m.className="mode cloud";
    m.lastElementChild.textContent = user ? (canEdit()? "동기화 중 · "+(user.email||"") : "보기 전용 · 편집 권한 없는 계정") : "동기화 중 · 보기 전용";
    a.hidden=false; a.textContent = user ? "로그아웃" : "관리자 로그인";
  } else {
    m.className="mode warn";
    m.lastElementChild.textContent = fbConfigured() ? "클라우드 연결 실패 · 이 브라우저에만 저장" : "이 브라우저에만 저장 중 (config.js 미설정)";
    a.hidden=true;
  }
}
/* 이미지는 최대 640px JPEG로 줄여 데이터 안에 함께 저장 */
function shrink(file, max=640){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=rej;
    fr.onload=()=>{ const im=new Image(); im.onerror=rej; im.onload=()=>{
      const k=Math.min(1,max/Math.max(im.width,im.height));
      const c=document.createElement("canvas"); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
      const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(im,0,0,c.width,c.height);
      res(c.toDataURL("image/jpeg",0.82)); }; im.src=fr.result; };
    fr.readAsDataURL(file);
  });
}
let allRefs = [];   /* 몬스터 + PC 전체 */
let monsters = [];  /* 지금 보고 있는 종류만 */
let kind = "monster";
const KINDS = {
  monster:{ label:"몬스터", counter:"대응 PC 도구", counterPh:"엽빛나", namePh:"태초의 악몽", guide:"공략", enPh:"Primordial Nightmare" },
  pc:     { label:"PC",    counter:"대응 몬스터",  counterPh:"태초의 악몽", namePh:"엽빛나", guide:"공략", enPh:"Ye Shunguang" },
  system: { label:"시스템", counter:"대응 항목",   counterPh:"", namePh:"태그 교체", guide:"설명", enPh:"Tag Switch" },
};
const kindOf = m => m.kind==="pc" ? "pc" : m.kind==="system" ? "system" : "monster";
const SYS_KEYS=["game","cats","keywords"];
const railCats = () => CATS.filter(c => kind==="system" ? SYS_KEYS.includes(c.key) : !["cats","keywords"].includes(c.key));
const THEAD = {
  ref: `<th class="grip" aria-label="순서"></th><th id="thName">몬스터</th><th>이미지</th><th>후킹 이미지</th><th>테마</th><th>레벨 테마</th><th>외형</th><th>무기</th><th>전투 확장 시스템</th><th id="thCounter">대응 PC 도구</th><th>공략</th><th></th>`,
  system: `<th class="grip" aria-label="순서"></th><th id="thName">시스템</th><th>이미지</th><th>분류</th><th>키워드</th><th>설명</th><th></th>`,
};
function syncKind(){
  monsters = allRefs.filter(m=>kindOf(m)===kind);
  const K=KINDS[kind];
  const head=$("#thead"); const want = kind==="system" ? "system" : "ref";
  if(head && head.dataset.k!==want){ head.innerHTML=`<tr>${THEAD[want]}</tr>`; head.dataset.k=want; }
  CAT.pcs.label = K.counter; CAT.pcs.root = K.counter;
  CAT.systems.root = `${K.label} 전투 확장 시스템`;
  const th=$("#thName"); if(th) th.textContent=K.label;
  const tc=$("#thCounter"); if(tc) tc.textContent=K.counter;
}
let filters = new Set();   // "cat|value"
let query = "";
let loaded = false;

/* ---------- helpers ---------- */
function vals(m, key){
  if (key === "game" || key === "version") return m[key] ? [m[key]] : [];
  if (CAT[key].deep) return (m[key]||[]).map(e=>e.name);
  return m[key] || [];
}
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.hidden=false;
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,1800);
}
function imgSrc(m){ return m.image || ""; }
/* ---------- Cloudinary ---------- */
const CLOUDS = (CFG.cloudinary||[]).filter(c=>c && c.cloudName && c.uploadPreset && !/본인|붙여|여기/.test(c.cloudName+c.uploadPreset));
const upTarget = () => CLOUDS[CLOUDS.length-1] || null;   /* 새 파일은 목록의 마지막 계정으로 */

function mediaUrls(md, w){
  const base = `https://res.cloudinary.com/${encodeURIComponent(md.cloud)}/${md.rt}/upload/`;
  const id = md.id, sz = `w_${w},c_limit`;
  /* 영상·움짤은 크기 하나(SD 640px)만 만들어 썸네일과 크게 보기에 같이 씀 → 변환 크레딧 절약 */
  const vz = "w_640,c_limit";
  if (md.rt==="video") return {kind:"video", src:`${base}q_auto,${vz}/${id}.mp4`, poster:`${base}so_0,${vz}/${id}.jpg`, orig:md.orig||`${base}${id}.${md.fmt||"mp4"}`};
  /* 움직이는 WEBP가 이미지로 올라가 있으면 (변환 없이) 원본 그대로 보여 줌: Cloudinary 변환 시 잘리는 문제 회피 */
  if (md.anim && /webp/i.test(md.fmt||"")) return {kind:"img", src:`${base}${id}.webp`, orig:`${base}${id}.webp`};
  if (md.anim)         return {kind:"video", src:`${base}q_auto,${vz}/${id}.mp4`, poster:`${base}pg_1,${vz}/${id}.jpg`, orig:`${base}${id}.${md.fmt||"gif"}`};
  return {kind:"img", src:`${base}f_auto,q_auto,${sz}/${id}`, orig:`${base}${id}.${md.fmt||"jpg"}`};
}

function mediaHTML(m, w, big){

function ytId(u){

    const x=new URL(u), h=x.hostname.replace(/^(www|m|music)\./,"");
    if(h==="youtu.be") return x.pathname.slice(1).split("/")[0]||"";
    if(h==="youtube.com"||h==="youtube-nocookie.com"){
      if(x.searchParams.get("v")) return x.searchParams.get("v");
      const mm=x.pathname.match(/^\/(shorts|embed|live|v)\/([\w-]{6,})/); if(mm) return mm[2];
    }
  }catch{}
  return "";
}

}

function haystack(m){
  const parts=[m.game,m.version,m.name,m.nameEn,m.link,m.guide,...(m.cats||[]),...(m.keywords||[]),...(m.parents||[]),...(m.similar||[]),m.ext,...(m.theme||[]),...(m.levels||[]),...(m.hooks||[]),...(m.looks||[]),...(m.weapons||[])];
  for (const e of (m.systems||[])){ const sr=sysRefFor(m.game,e.name); parts.push(e.name, sr&&sr.nameEn, ...((sr&&sr.keywords)||[])); }
  for (const e of (m.pcs||[])){ const d=getDef(kindOf(m),"pcs",e.name); parts.push(e.name,d.nameEn,d.label,d.note); }
  return parts.filter(Boolean).join(" ").toLowerCase();
}

const defKey=(k,cat,name)=>`${k}|${cat}|${name}`;

function getDef(k,cat,name){
  const d=defs.get(defKey(k,cat,name));
  if(d) return {nameEn:d.nameEn||"", label:d.label||"공략", note:d.note||"", saved:true};
  /* 예전처럼 몬스터마다 적어 둔 메모가 있으면 모아서 보여 줌 (저장하면 공통 설명이 됨) */

/* 1.10 > 1.9, 2.0 > 1.10 처럼 숫자로 비교 */
function cmpVersion(a,b){
  const pa=String(a||"").match(/\d+|[^\d.\s]+/g)||[], pb=String(b||"").match(/\d+|[^\d.\s]+/g)||[];
  for(let i=0;i<Math.max(pa.length,pb.length);i++){
    const x=pa[i], y=pb[i];
    if(x===undefined) return -1; if(y===undefined) return 1;
    const nx=/^\d+$/.test(x), ny=/^\d+$/.test(y);
    if(nx&&ny){ const d=Number(x)-Number(y); if(d) return d; }
    else { const d=x.localeCompare(y,"ko"); if(d) return d; }
  }
  return 0;
}
const byName=(a,b)=>(a.name||"").localeCompare(b.name||"","ko");
const byRecent=(a,b)=>(b.createdAt||0)-(a.createdAt||0);
const emptyLast=(a,b,f)=>{ const ea=!f(a), eb=!f(b); return ea===eb?0:(ea?1:-1); };
function manualSorted(arr){
  /* 순서를 아직 안 정한 새 항목은 맨 위 (최근 추가순), 그다음 정한 순서 */
  return arr.slice().sort((a,b)=>{
    const ha=typeof a.order==="number", hb=typeof b.order==="number";
    if(ha!==hb) return ha?1:-1;
    if(!ha) return byRecent(a,b);
    return (a.order-b.order)||byRecent(a,b);
  });
}
function sortList(arr){
  const a=arr.slice();
  switch(kind==="system" && sortMode.startsWith("version") ? "recent" : sortMode){
    case "game": return a.sort((x,y)=>emptyLast(x,y,m=>m.game)||(x.game||"").localeCompare(y.game||"","ko")||emptyLast(x,y,m=>m.version)||cmpVersion(y.version,x.version)||byName(x,y));
    case "version": return a.sort((x,y)=>emptyLast(x,y,m=>m.version)||cmpVersion(y.version,x.version)||(x.game||"").localeCompare(y.game||"","ko")||byName(x,y));
    case "version-asc": return a.sort((x,y)=>emptyLast(x,y,m=>m.version)||cmpVersion(x.version,y.version)||(x.game||"").localeCompare(y.game||"","ko")||byName(x,y));
    case "name": return a.sort((x,y)=>byName(x,y)||byRecent(x,y));
    case "manual": return manualSorted(a);
    default: return a.sort(byRecent);
  }
}

async function reorder(ids){
  const changed=[]; ids.forEach((id,i)=>{ const m=allRefs.find(x=>x.id===id); if(m && m.order!==i) changed.push([id,i]); });
  if(!changed.length) return;
  changed.forEach(([id,i])=>{ const m=allRefs.find(x=>x.id===id); if(m) m.order=i; });
  syncKind(); render();
  try{
    if(mode==="cloud"){
      for(let k=0;k<changed.length;k+=400){ const b=fs.batch(); changed.slice(k,k+400).forEach(([id,i])=>b.update(COL().doc(id),{order:i})); await b.commit(); }
    } else commit(allRefs.slice());
  }catch(ex){ toast(errMsg(ex)); }
}

  const ids=manualSorted(monsters).map(m=>m.id).filter(id=>id!==dragId);
  let at=ids.indexOf(targetId); if(at<0) return;
  if(after) at++;

}

/* ---------- 시스템 확장 구조: 부모 → 자식 (부모 여러 개 가능) ---------- */
let treeFocus="";
const TR={CW:220, GX:74, RH:96, NH:82, TOP:36, PAD:16};
let treeGame="";
/* 확장 관계는 같은 게임 안에서만 이어짐: 노드 키 = 게임 + 이름 */
const SEP="\u0001";
const tkey=(game,name)=>`${game||""}${SEP}${name}`;
const tsplit=k=>{ const i=k.indexOf(SEP); return {game:k.slice(0,i), name:k.slice(i+1)}; };
function renderTree(list, merge){
  const gb=$("#groupbox"), tb=$("#tablebox"); tb.hidden=true; gb.hidden=false;
  const ko=(a,b)=>a.localeCompare(b,"ko");
  /* 기본: 게임 하나씩 (확장은 그 게임 안에서만) / 톺아보기: 모든 게임을 이름으로 합쳐서 */
  const gCount=new Map(); list.forEach(m=>{ if(m.game) gCount.set(m.game,(gCount.get(m.game)||0)+1); });
  const tGames=[...gCount.keys()].sort((a,b)=>gCount.get(b)-gCount.get(a)||ko(a,b));
  if(!merge){
    if(!tGames.includes(treeGame)) treeGame=tGames[0]||"";
    if(treeGame) list=list.filter(m=>m.game===treeGame);
  }
  const allG=false;
  const N=new Map();
  const node=(game,name)=>{ const k=tkey(game,name); if(!N.has(k)) N.set(k,{key:k,name,game:game||"",refs:[],parents:new Set(),kids:new Set()}); return N.get(k); };
  const G=m=>merge?"":(m.game||"");
  list.forEach(m=>{ const n=node(G(m),m.name); n.refs.push(m);
    (m.parents||[]).forEach(p=>{ if(!p||p===m.name) return; const pn=node(G(m),p); n.parents.add(pn.key); pn.kids.add(n.key); }); });
  const all=[...N.values()];
  const linked=all.filter(n=>n.parents.size||n.kids.size);
  const lonely=all.filter(n=>!n.parents.size&&!n.kids.size&&n.refs.length).sort((a,b)=>ko(a.game,b.game)||ko(a.name,b.name));
  /* 계열(연결된 묶음) — 게임이 다르면 다른 계열 */
  const comp=new Map(); let ci=0;
  linked.forEach(n=>{ if(comp.has(n.key)) return; const st=[n.key]; comp.set(n.key,ci);
    while(st.length){ const x=N.get(st.pop()); [...x.parents,...x.kids].forEach(y=>{ if(!comp.has(y)){ comp.set(y,ci); st.push(y); } }); } ci++; });

function wireTree(N){
  const sel=$("#trFam"); if(sel) sel.onchange=e=>{ treeFocus=e.target.value; render(); };
  const gs=$("#trGame"); if(gs) gs.onchange=e=>{ treeGame=e.target.value; treeFocus=""; render(); };
  const tree=$("#tree"); if(!tree||!N) return;
  const lineage=name=>{ const set=new Set([name]);
    const up=x=>N.get(x)&&N.get(x).parents.forEach(p=>{ if(!set.has(p)){ set.add(p); up(p); } });
    const dn=x=>N.get(x)&&N.get(x).kids.forEach(k=>{ if(!set.has(k)){ set.add(k); dn(k); } });
    up(name); dn(name); return set; };
  const clear=()=>{ tree.classList.remove("dim"); tree.querySelectorAll(".hl").forEach(e=>e.classList.remove("hl")); };
  const on=name=>{ clear(); const set=lineage(name); tree.classList.add("dim");
    tree.querySelectorAll(".tnode").forEach(b=>{ if(set.has(b.dataset.tnode)) b.classList.add("hl"); });
    tree.querySelectorAll("path").forEach(p=>{ if(set.has(p.dataset.f)&&set.has(p.dataset.t)) p.classList.add("hl"); }); };
  tree.addEventListener("mouseover",e=>{ const b=e.target.closest(".tnode"); if(b) on(b.dataset.tnode); });
  tree.addEventListener("mouseleave",clear);
  tree.addEventListener("focusin",e=>{ const b=e.target.closest(".tnode"); if(b) on(b.dataset.tnode); });
}

/* ---------- 자동완성: 이미 등록된 게임·태그를 드롭다운으로 ---------- */
const AC_SINGLE=new Set(["game","version"]);
const AC_SRC={w_tags:"worktags", f_similar:"parents", f_cats:"cats", f_keywords:"keywords", f_version:"version", f_hooks:"hooks", f_levels:"levels", f_theme:"theme", f_looks:"looks", f_weapons:"weapons", f_systems:"systems", f_pcs:"pcs"};
let acBox=null, acInput=null, acItems=[], acIdx=-1;
function acValues(cat){
  const cnt=new Map();
  if(cat==="parents"){
    const me=(document.getElementById("f_name")||{}).value||"";
    sysNameList().names.forEach(n=>{ if(n!==me) cnt.set(n,0); });
    allRefs.forEach(m=>(m.parents||[]).forEach(p=>{ if(p!==me) cnt.set(p,(cnt.get(p)||0)+1); }));
    return [...cnt].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],"ko"));
  }
  if(cat==="worktags") works.forEach(w=>new Set(w.tags||[]).forEach(v=>cnt.set(v,(cnt.get(v)||0)+1)));
  else monsters.forEach(m=>new Set(vals(m,cat)).forEach(v=>cnt.set(v,(cnt.get(v)||0)+1)));
  return [...cnt].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],"ko"));
}
function acParts(input){ return AC_SINGLE.has(AC_SRC[input.id]) ? [input.value] : input.value.split("/"); }
function acOpen(input){
  const cat=AC_SRC[input.id]; if(!cat) return;
  const parts=acParts(input), cur=parts[parts.length-1].trim(), lc=cur.toLowerCase();
  const used=new Set(parts.slice(0,-1).map(t=>t.trim()));
  acItems=acValues(cat).filter(([v])=>!used.has(v) && v!==cur && (!lc || v.toLowerCase().includes(lc))).slice(0,10);
  if(!acItems.length){ acClose(); return; }
  if(!acBox){ acBox=document.createElement("div"); acBox.className="ac"; acBox.setAttribute("role","listbox"); document.body.appendChild(acBox);
    acBox.addEventListener("mousedown",e=>{ const b=e.target.closest("button[data-i]"); if(!b) return; e.preventDefault(); acPick(+b.dataset.i); }); }
  acInput=input; acIdx=lc?0:-1;
  const hl=v=>{ if(!lc) return esc(v); const k=v.toLowerCase().indexOf(lc); return esc(v.slice(0,k))+"<mark>"+esc(v.slice(k,k+cur.length))+"</mark>"+esc(v.slice(k+cur.length)); };
  acBox.innerHTML=`<div class="hint">${cat==="game"?"등록된 게임":cat==="version"?"등록된 버전":cat==="worktags"?"등록된 태그 · Enter로 추가":cat==="parents"?"시스템 이름 · Enter로 추가":"등록된 "+CAT[cat].label+" · Enter로 추가"}</div>`+acItems.map(([v,n],k)=>{ const en=(cat==="systems"||cat==="pcs")?getDef(kind,cat,v).nameEn:""; return `<button type="button" role="option" data-i="${k}" class="${k===acIdx?"on":""}"><span>${hl(v)}${en?`<span class="en" lang="en">${esc(en)}</span>`:""}</span><span class="n">${n}</span></button>`; }).join("");
  const rc=input.getBoundingClientRect();
  acBox.style.left=rc.left+"px"; acBox.style.width=Math.max(200,rc.width)+"px";
  const below=innerHeight-rc.bottom;
  if(below<200 && rc.top>below){ acBox.style.top=""; acBox.style.bottom=(innerHeight-rc.top+4)+"px"; }
  else { acBox.style.bottom=""; acBox.style.top=(rc.bottom+4)+"px"; }
  acBox.hidden=false;
}
function acClose(){ if(acBox) acBox.hidden=true; acIdx=-1; acItems=[]; }
function acPick(k){
  const it=acItems[k]; if(!it||!acInput) return;
  const input=acInput;
  if(AC_SINGLE.has(AC_SRC[input.id])){ input.value=it[0]; acClose(); renderPick(input); if(input.id==="f_game"){ const vv=$("#f_version"); if(vv) renderPick(vv); } return; }
  const parts=acParts(input).slice(0,-1).map(t=>t.trim()).filter(Boolean); parts.push(it[0]);

  acOpen(input);

function refText(m){
  const j=a=>(a||[]).join(" / ");
  const L=[`[${m.game||"-"}${m.version?" "+m.version:""}] ${{pc:"PC ",system:"시스템 "}[kindOf(m)]||""}${m.name}${m.nameEn?` (${m.nameEn})`:""}`];
  if((m.cats||[]).length)    L.push(`분류: ${j(m.cats)}`);
  if((m.keywords||[]).length) L.push(`키워드: ${j(m.keywords)}`);
  if((m.parents||[]).length) L.push(`확장 원본: ${j(m.parents)}`);
  if(m.ext) L.push(`확장 포인트: ${m.ext}`);
  if(kindOf(m)==="system" && similarOf(m).length) L.push(`비슷한 시스템: ${similarOf(m).join(" / ")}`);
  if((m.hooks||[]).length)   L.push(`후킹 이미지: ${j(m.hooks)}`);
  if((m.theme||[]).length)   L.push(`테마: ${j(m.theme)}`);
  if((m.levels||[]).length)  L.push(`레벨 테마: ${j(m.levels)}`);
  if((m.looks||[]).length)   L.push(`외형: ${j(m.looks)}`);
  if((m.weapons||[]).length) L.push(`무기: ${j(m.weapons)}`);
  for(const [k,lab] of [["systems","전투 확장 시스템"],["pcs","대응 PC 도구"]]){
    for(const e of (m[k]||[])){
      const d=getDef(kindOf(m),k,e.name);
      if(k==="systems"){ const sr=sysRefFor(m.game,e.name); const gp=sr?guidePlain(sr.guide||""):"";
        L.push(`${lab}: ${e.name}${sr&&sr.nameEn?` (${sr.nameEn})`:""}`);
        if(sr&&sr.ext) L.push(`  └ ${sr.ext}`);
        if(gp) L.push(gp.split("\n").map(x=>"    "+x).join("\n"));
        continue; }
      L.push(`${k==="pcs"?KINDS[kindOf(m)].counter:lab}: ${e.name}${d.nameEn?` (${d.nameEn})`:""}`);
      if(d.note) L.push(`  └ ${d.label||"공략"}\n`+d.note.split("\n").map(x=>"    "+x).join("\n"));
    }
  }
  if((m.guide||"").trim()) L.push(`${KINDS[kindOf(m)].guide}:\n`+m.guide.trim().split("\n").map(x=>"  "+x).join("\n"));
  if(m.link) L.push(`링크: ${m.link}`);
  const o=origUrl(m); if(o && !o.startsWith("data:")) L.push(`이미지: ${o}`);
  return L.join("\n");
}

const SG_KEY="monster-ref-sysgroup";
let sysGroup = (()=>{ try{ return localStorage.getItem(SG_KEY)!=="0"; }catch{ return true; } })();
const sysOpen = new Set();
const sysGrouping = () => kind==="system" && sub==="list" && sysGroup;
function similarOf(m){
  const set=new Set((m.similar||[]).filter(x=>x&&x!==m.name));
  allRefs.forEach(o=>{ if(kindOf(o)==="system" && o.name!==m.name && (o.similar||[]).includes(m.name)) set.add(o.name); });
  return [...set];
}
function groupedRows(list){
  /* 부모는 같은 게임의 시스템만 (다른 게임의 같은 이름과는 섞지 않음) */
  const K=m=>tkey(m.game,m.name);
  const keys=new Set(list.map(K)), order=new Map(list.map((m,i)=>[m.id,i]));
  const pk=(m,p)=>tkey(m.game,p);
  const kidsOf=new Map();
  list.forEach(m=>(m.parents||[]).forEach(p=>{ const k=pk(m,p); if(p!==m.name && keys.has(k)){ if(!kidsOf.has(k)) kidsOf.set(k,[]); kidsOf.get(k).push(m); } }));
  const isRoot=m=>!(m.parents||[]).some(p=>p!==m.name && keys.has(pk(m,p)));
  const out=[], seen=new Set();
  const walk=(m,depth,path)=>{
    seen.add(m.id);
    const kids=(kidsOf.get(K(m))||[]).filter(k=>!path.has(K(k))).sort((a,b)=>order.get(a.id)-order.get(b.id));
    const open=sysOpen.has(K(m));
    out.push(rowHTML(m,{depth,kids:kids.length,open}));
    if(open) kids.forEach(k=>walk(k,depth+1,new Set([...path,K(k)])));
  };
  const roots=list.filter(isRoot);
  const reach=new Set(), st=roots.map(K);
  while(st.length){ const n=st.pop(); if(reach.has(n)) continue; reach.add(n); (kidsOf.get(n)||[]).forEach(k=>st.push(K(k))); }
  roots.forEach(m=>walk(m,0,new Set([K(m)])));
  list.forEach(m=>{ if(!reach.has(K(m)) && !seen.has(m.id)){ reach.add(K(m)); walk(m,0,new Set([K(m)])); } });
  return out.join("");
}

/* ---------- click delegation ---------- */
document.addEventListener("click", e=>{
  const lk=e.target.closest("[data-gosys],[data-gouse],[data-addsys]");
  if(lk){ e.preventDefault(); e.stopPropagation();
    if(lk.dataset.addsys){ const i=lk.dataset.addsys.indexOf("|"); addSysRef(lk.dataset.addsys.slice(0,i), lk.dataset.addsys.slice(i+1)); }
    else if(lk.dataset.gosys) goSysRef(lk.dataset.gosys);
    else { const [k,g,...rest]=lk.dataset.gouse.split("|"); goUsers(k,g,rest.join("|")); }
    return; }
  const t=e.target.closest("[data-ext],[data-tag],[data-clear],[data-edit],[data-del],[data-zoom],[data-deep],[data-copy],[data-dup],[data-guide],[data-guideadd]");
  if(!t) return;
  if (t.dataset.tag){ const f=t.dataset.tag; filters.has(f)?filters.delete(f):filters.add(f); hidePop(true); render(); }
  else if (t.hasAttribute("data-clear")){ filters.clear(); query=""; $("#q").value=""; render(); }
  else if (t.dataset.edit){ openForm(monsters.find(m=>m.id===t.dataset.edit)); }
  else if (t.dataset.ext){ const m=allRefs.find(x=>x.id===t.dataset.ext); if(m) openExtForm(m); }
  else if (t.dataset.guide){ const m=allRefs.find(x=>x.id===t.dataset.guide); if(m) openGuide(m); }
  else if (t.dataset.guideadd){ const m=allRefs.find(x=>x.id===t.dataset.guideadd); if(m){ openForm(m); focusGuide(); } }
  else if (t.dataset.dup){ const m=monsters.find(x=>x.id===t.dataset.dup); if(m) openForm(null, m); }
  else if (t.dataset.copy){ const m=monsters.find(x=>x.id===t.dataset.copy); if(m) copyText(refText(m), t); }
  else if (t.dataset.del){ confirmDelete(t.dataset.del); }
  else if (t.dataset.zoom){
    const m=monsters.find(x=>x.id===t.dataset.zoom); if(!m) return;
    const lb=$("#lightbox"), o=origUrl(m);
    lb.innerHTML=`<div class="lb">${mediaHTML(m,1280,true)}<div class="lbbar"><span>${esc(m.game)} · ${esc(m.name)}</span>${o&&!o.startsWith("data:")?`<a href="${esc(o)}" target="_blank" rel="noopener">원본 열기</a>`:""}<button type="button" id="lbClose">닫기</button></div></div>`;
    lb.hidden=false;
  }
  else if (t.dataset.deep){ // 탭(모바일) 또는 클릭: 고정
    showPop(t, true);
  }
});
$("#lightbox").addEventListener("click",e=>{ if(e.target.id==="lightbox"||e.target.id==="lbClose"){ $("#lightbox").hidden=true; $("#lightbox").innerHTML=""; } });
$("#q").addEventListener("input", e=>{ query=e.target.value; render(); });
$("#addBtn").addEventListener("click", ()=>openForm(null));
$("#deadBtn").addEventListener("click", ()=>{ filters.has(DEAD)?filters.delete(DEAD):filters.add(DEAD); render(); });

/* ---------- popover (hover detail) ---------- */
const pop=$("#pop");
let popKey=null, pinned=false, editing=false, hideT=null, showT=null, anchorEl=null;

document.addEventListener("mouseover", e=>{
  const t=e.target.closest("[data-deep]");
  if (t && !pinned){ clearTimeout(hideT); clearTimeout(showT); showT=setTimeout(()=>showPop(t,false),140); }
});
document.addEventListener("mouseout", e=>{
  const t=e.target.closest("[data-deep]");
  if (t && !t.contains(e.relatedTarget)){ clearTimeout(showT); schedHide(); }
});
pop.addEventListener("mouseenter", ()=>clearTimeout(hideT));
pop.addEventListener("mouseleave", ()=>schedHide());
document.addEventListener("mousedown", e=>{ if(!pop.hidden && pinned && !editing && !pop.contains(e.target) && !e.target.closest("[data-deep]")) hidePop(true); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ if(!$("#scrim").hidden) closeForm(); else if(!$("#lightbox").hidden){ $("#lightbox").hidden=true; $("#lightbox").innerHTML=""; } else hidePop(true);} });

function schedHide(){ if(pinned||editing) return; clearTimeout(hideT); hideT=setTimeout(()=>hidePop(false),220); }
function hidePop(force){ if(editing && !force) return; pop.hidden=true; popKey=null; pinned=false; editing=false; anchorEl=null; }

function showPop(el, pin){
  const key=el.dataset.deep;
  if (editing && key!==popKey) return;
  anchorEl=el; popKey=key; if(pin) pinned=true;
  drawPop(false); place();
}
function entryFor(key){
  const [id,cat,i]=key.split("|"); const m=allRefs.find(x=>x.id===id);
  return m && m[cat] && m[cat][+i] ? {m,cat,i:+i,e:m[cat][+i]} : null;
}
function crumbs(x, editLabel){
  const c=CAT[x.cat], d=getDef(kindOf(x.m),x.cat,x.e.name);
  const label = editLabel ? `<input id="popLabel" type="text" value="${esc(d.label)}" aria-label="섹션 이름">` : `<b>${esc(d.label)}</b>`;
  return `<div class="crumb ${c.cls}"><span class="root">${c.root}</span><span class="sep">›</span><b>${esc(x.e.name)}</b>${d.nameEn?`<span class="en" lang="en">${esc(d.nameEn)}</span>`:""}<span class="sep">›</span><span>${esc(x.m.game||"-")}</span><span class="sep">›</span><span>${esc(x.m.name)}</span><span class="sep">›</span>${label}</div>`;
}
function usersOf(k,cat,name){ return allRefs.filter(m=>kindOf(m)===k && (m[cat]||[]).some(e=>e.name===name)); }
function drawPop(edit){
  const x=entryFor(popKey); if(!x){hidePop(true);return;}
  editing=edit;

    pop.innerHTML = `<div class="crumb c-sys"><span class="root">전투 확장 시스템</span><span class="sep">›</span><b>${esc(x.e.name)}</b>${sr&&sr.nameEn?`<span class="en" lang="en">${esc(sr.nameEn)}</span>`:""}<span class="sep">›</span><span>${esc(x.m.game||"-")}</span><span class="sep">›</span><span>${esc(x.m.name)}</span></div>`

            ${(sr.parents||[]).length?`<div class="par">↳ ${esc(sr.parents.join(" + "))}에서 확장${sr.ext?` · ${esc(sr.ext)}`:""}</div>`:(sr.ext?`<div class="par">${esc(sr.ext)}</div>`:"")}
            ${(sr.keywords||[]).length?`<div class="par" style="color:var(--t-theme)">${sr.keywords.map(k=>"#"+esc(k)).join(" ")}</div>`:""}
            ${gp?`<div class="sum" style="white-space:pre-wrap">${esc(gp.slice(0,400))}${gp.length>400?"…":""}</div>`:`<div class="sum" style="color:var(--muted)">설명이 아직 없어요.</div>`}</div>
          <div class="foot"><span class="hint">${pinned?"":"칩을 클릭하면 창이 고정돼요"}</span><button type="button" class="btn sm" data-gosys="${esc(sr.id)}">시스템 레퍼런스 열기 ↗</button></div>`
        : `<div class="body blank">${esc(x.m.game||"이 게임")}의 시스템 레퍼런스에 ‘${esc(x.e.name)}’이(가) 아직 없어요. 등록하면 여기에 그 내용이 보여요.</div>
          <div class="foot"><span class="hint">게임 이름과 시스템 이름이 같으면 연결돼요</span><button type="button" class="btn sm primary edit-only" data-addsys="${esc(x.m.game||"")}|${esc(x.e.name)}">시스템 레퍼런스에 추가</button></div>`);
    pop.hidden=false; return;
  }
  if(!edit){
    pop.innerHTML = crumbs(x,false)
      + (n>1?`<div class="shared">같은 ${esc(x.e.name)}를 쓰는 ${KINDS[kindOf(x.m)].label} ${n}개가 이 내용을 함께 봐요</div>`:"")
      + (()=>{ const sr = x.cat==="systems" ? sysRefFor(x.m.game, x.e.name) : null; if(!sr) return "";
          const gp=guidePlain(sr.guide||"");
          return `<div class="srlink"><div class="top"><span>시스템 레퍼런스</span><b>${esc(sr.name)}</b>${sr.nameEn?`<small lang="en">${esc(sr.nameEn)}</small>`:""}<button type="button" class="btn sm" data-gosys="${esc(sr.id)}">열기 ↗</button></div>
            ${(sr.parents||[]).length?`<div class="par">↳ ${esc(sr.parents.join(" + "))}에서 확장${sr.ext?` · ${esc(sr.ext)}`:""}</div>`:(sr.ext?`<div class="par">${esc(sr.ext)}</div>`:"")}
            ${gp?`<div class="sum">${esc(gp.slice(0,160))}${gp.length>160?"…":""}</div>`:""}</div>`; })()
      + `<div class="body ${d.note?"":"blank"}">${d.note?esc(d.note):"아직 공략 내용이 없어요. 수정을 눌러 적어 주세요."}</div>`
      + `<div class="foot"><span class="hint">${pinned?"":"칩을 클릭하면 창이 고정돼요"}</span><button type="button" class="btn sm" id="popEdit">수정</button></div>`;

      + (n>1?`<div class="shared">저장하면 ${esc(x.e.name)}를 쓰는 ${n}개 모두에 반영돼요</div>`:"")
      + `<textarea id="popNote" placeholder="예) 극한 회피 또는 극한 지원으로 제어기를 피함 → N회 성공 시 피해…">${esc(d.note)}</textarea>`
      + `<div class="foot"><span class="hint">⌘/Ctrl+Enter 저장</span><button type="button" class="btn sm" id="popCancel">취소</button><button type="button" class="btn sm primary" id="popSave">저장</button></div>`;
    $("#popCancel").onclick=()=>{ drawPop(false); place(); };

  }
  pop.hidden=false;
}
async function savePop(){
  const x=entryFor(popKey); if(!x) return;
  const btn=$("#popSave"); btn.disabled=true; btn.textContent="저장 중…";
  try{ await saveDef(kindOf(x.m), x.cat, x.e.name, {nameEn:$("#popEn").value, label:$("#popLabel").value, note:$("#popNote").value}); editing=false; drawPop(false); place(); toast("저장했어요"); }
  catch(err){ btn.disabled=false; btn.textContent="저장"; toast(errMsg(err)); }
}
function place(){
  if(!anchorEl||pop.hidden) return;
  const r=anchorEl.getBoundingClientRect(), w=pop.offsetWidth, h=pop.offsetHeight, vw=innerWidth, vh=innerHeight;
  let left=Math.min(Math.max(16,r.left), vw-w-16);
  let top=r.bottom+6; if(top+h>vh-12) top=Math.max(12,r.top-h-6);
  pop.style.left=left+"px"; pop.style.top=top+"px";
}
addEventListener("resize",place);
addEventListener("scroll",()=>{ if(!pinned) hidePop(false); else place(); },true);

/* 움직이는 GIF·WEBP인지 파일 헤더로 판별 */
async function isAnimated(file){
  const t=(file.type||"").toLowerCase();
  if(!/gif|webp|png/.test(t)) return false;
  const b=new Uint8Array(await file.arrayBuffer());
  const str=(o,n)=>String.fromCharCode(...b.subarray(o,o+n));
  if(str(0,3)==="GIF"){ let n=0; for(let k=0;k<b.length-2;k++){ if(b[k]===0x21&&b[k+1]===0xF9&&b[k+2]===0x04 && ++n>1) return true; } return false; }
  if(str(0,4)==="RIFF"&&str(8,4)==="WEBP"){ return str(12,4)==="VP8X" && (b[20]&0x02)===0x02; }
  if(b[0]===0x89&&str(1,3)==="PNG"){ const lim=Math.min(b.length-4,4096); for(let k=8;k<lim;k++){ if(str(k,4)==="acTL") return true; if(str(k,4)==="IDAT") return false; } }
  return false;
}

function cloudUpload(t, blob, rt, onp){
  return new Promise((res,rej)=>{
    const fd=new FormData(); fd.append("file", blob, blob.name||"upload"); fd.append("upload_preset", t.uploadPreset);
    const x=new XMLHttpRequest();
    x.open("POST", `https://api.cloudinary.com/v1_1/${encodeURIComponent(t.cloudName)}/${rt}/upload`);
    x.upload.onprogress=e=>{ if(e.lengthComputable) onp(Math.round(e.loaded/e.total*100)); };
    x.onload=()=>{ let j={}; try{ j=JSON.parse(x.responseText); }catch{}
      if(x.status>=200&&x.status<300) res(j); else rej({status:x.status, detail:(j.error&&j.error.message)||""}); };
    x.onerror=()=>rej({msg:"인터넷 연결을 확인해 주세요"});
    x.send(fd);
  });
}
function cloudErr(ex){
  if(ex&&ex.msg) return ex.msg;
  const d=(ex&&ex.detail)||"";
  if(/preset/i.test(d)) return "업로드 설정 이름(uploadPreset)을 확인해 주세요. Cloudinary에서 Unsigned로 만들어야 해요";
  if(/cloud name|Invalid cloud/i.test(d)) return "Cloudinary 클라우드 이름(cloudName)을 확인해 주세요";
  if(/size|too large/i.test(d)) return "파일이 너무 커요. 이미지 10MB, 영상 100MB까지 올릴 수 있어요";
  if(ex&&(ex.status===420||ex.status===429)||/limit|quota|exceed/i.test(d)) return "Cloudinary 무료 한도에 걸렸어요. config.js에 계정을 하나 더 추가해 주세요";
  return "업로드하지 못했어요"+(d?": "+d:"");
}
/* 10MB 넘는 움직이는 GIF·WEBP를 브라우저에서 영상으로 변환 (크롬·엣지) */
async function animToVideo(file, onp){
  if(!("ImageDecoder" in window) || !window.MediaRecorder || !HTMLCanvasElement.prototype.captureStream)
    throw {msg:`이 GIF는 ${MB(file.size)}MB라 영상으로 바꿔 올려야 하는데, 이 브라우저는 변환을 지원하지 않아요. 크롬이나 엣지에서 올려 주세요`};
  const mime=["video/mp4;codecs=avc1","video/mp4","video/webm;codecs=vp9","video/webm"].find(t=>MediaRecorder.isTypeSupported(t));
  if(!mime) throw {msg:"이 브라우저는 영상 변환을 지원하지 않아요. 크롬이나 엣지에서 올려 주세요"};
  const dec=new ImageDecoder({data:file.stream(), type:file.type||"image/gif"});
  await dec.completed; await dec.tracks.ready;
  const n=dec.tracks.selectedTrack.frameCount;
  const f0=(await dec.decode({frameIndex:0})).image;
  const k=Math.min(1, 960/Math.max(f0.displayWidth,f0.displayHeight));
  const W=Math.max(2,Math.round(f0.displayWidth*k/2)*2), H=Math.max(2,Math.round(f0.displayHeight*k/2)*2);
  f0.close();
  const c=document.createElement("canvas"); c.width=W; c.height=H; const g=c.getContext("2d");
  g.fillStyle="#fff"; g.fillRect(0,0,W,H);
  const rec=new MediaRecorder(c.captureStream(30),{mimeType:mime, videoBitsPerSecond:3000000});
  const chunks=[]; rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
  const stopped=new Promise(res=>rec.onstop=res);
  rec.start(250);
  for(let i=0;i<n;i++){
    const fr=(await dec.decode({frameIndex:i})).image;
    g.fillRect(0,0,W,H); g.drawImage(fr,0,0,W,H);
    const ms=Math.max(20,(fr.duration||100000)/1000); fr.close();
    onp(Math.round((i+1)/n*100));
    await new Promise(res=>setTimeout(res,ms));
  }
  rec.stop(); await stopped; dec.close();
  const type=mime.split(";")[0];
  return new File([new Blob(chunks,{type})], (file.name||"clip").replace(/\.\w+$/,"")+(type.includes("mp4")?".mp4":".webm"), {type});
}
/* 움직이는 WEBP는 Cloudinary가 변환하면서 앞부분만 남기는 문제가 있어서,
   브라우저에서 먼저 영상으로 바꿔 올림 (원본 WEBP도 '원본 열기'용으로 함께 저장) */
const canConvertAnim = () => "ImageDecoder" in window && !!window.MediaRecorder && !!HTMLCanvasElement.prototype.captureStream;
const isWebp = f => /webp/i.test(f.type||"") || /\.webp$/i.test(f.name||"");
async function prepUpload(target, file, onp){
  const isVid=/^video\//.test(file.type||"");
  let rt="image", send=file, anim=false, orig="";
  if(isVid){ rt="video"; if(file.size>VID_MAX) throw {msg:`영상이 ${MB(file.size)}MB예요. 100MB까지 올릴 수 있어요`}; }
  else {
    anim=await isAnimated(file);
    if(anim && isWebp(file) && canConvertAnim()){
      if(file.size<=IMG_MAX){ try{ const o=await cloudUpload(target, file, "image", p=>onp(`원본 저장 ${p}%`)); orig=o.secure_url||""; }catch{} }
      send=await animToVideo(file, p=>onp(`영상 변환 ${p}%`)); rt="video"; anim=false;
    } else if(file.size>IMG_MAX){
      if(anim){ send=await animToVideo(file, p=>onp(`영상 변환 ${p}%`)); rt="video"; anim=false; }
      else { const blob=await (await fetch(await shrink(file,2400))).blob(); send=new File([blob],"image.jpg",{type:"image/jpeg"}); }
    }

  try{ localStorage.setItem(WORK_KEY,JSON.stringify(works)); localStorage.setItem(PROF_KEY,JSON.stringify(profile)); }
  catch{ toast("브라우저 저장 공간이 가득 찼어요"); throw new Error("quota"); }
}
function afterPort(){ render(); renderPublic(); const h=location.hash; if(h.startsWith("#work-") && !$("#workView").hidden) renderWorkView(h.slice(6)); }
const wstore={
  async set(id,data){ if(mode==="cloud") return COLW().doc(id).set(clean(data)); works=sortWorks(works.filter(w=>w.id!==id).concat({...data,id})); persistLocalPort(); afterPort(); },
  async update(id,patch){ if(mode==="cloud") return COLW().doc(id).update(patch); works=sortWorks(works.map(w=>w.id===id?{...w,...patch}:w)); persistLocalPort(); afterPort(); },
  async remove(id){ if(mode==="cloud") return COLW().doc(id).delete(); works=works.filter(w=>w.id!==id); persistLocalPort(); afterPort(); },
  async saveProfile(data){ if(mode==="cloud") return PROF().set(data); profile=data; persistLocalPort(); afterPort(); },
};
let wUnsub=null, pUnsub=null;
function startPortfolio(admin){
  if(wUnsub){ wUnsub(); wUnsub=null; } if(pUnsub){ pUnsub(); pUnsub=null; }
  worksLoaded=false;
  const q = admin ? COLW() : COLW().where("published","==",true);
  wUnsub=q.onSnapshot(snap=>{ works=sortWorks(snap.docs.map(d=>({id:d.id,...d.data()}))); worksLoaded=true; afterPort(); openWorkFromHash(); },
                      ()=>{ works=[]; worksLoaded=true; afterPort(); });
  pUnsub=PROF().onSnapshot(d=>{
    profile=(d.exists&&d.data())||{};
    if(admin && profile.archiveSort && profile.archiveSort!==sortMode){ sortMode=profile.archiveSort; try{ localStorage.setItem(SORT_KEY,sortMode); }catch{} applySortUI(); render(); }
    afterPort();
  }, ()=>{});
}
/* "이름 | 주소" 줄 목록 → [{label,url}] */
function parseLinks(t){
  return String(t||"").split("\n").map(x=>x.trim()).filter(Boolean).map(x=>{
    const k=x.indexOf("|"); if(k<0) return {label:"",url:x};
    return {label:x.slice(0,k).trim(), url:x.slice(k+1).trim()};
  }).filter(l=>l.url);
}
const linksText = ls => (ls||[]).map(l=>l.label?`${l.label} | ${l.url}`:l.url).join("\n");
function linkLabel(l){
  if(l.label) return l.label;
  if(ytId(l.url)) return "플레이 영상";
  try{ return new URL(l.url).hostname.replace(/^www\./,""); }catch{ return l.url; }
}
function contactHTML(l){
  const v=l.url, lab=l.label?`<b>${esc(l.label)}</b>`:"";
  if(/^https?:\/\//i.test(v)) return `<span>${lab}<a href="${esc(v)}" target="_blank" rel="noopener">${esc(v.replace(/^https?:\/\/(www\.)?/,"").replace(/\/$/,""))}</a></span>`;
  if(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return `<span>${lab}<a href="mailto:${esc(v)}">${esc(v)}</a></span>`;
  return `<span>${lab}${esc(v)}</span>`;
}
function workYt(w){ const l=(w.links||[]).find(l=>ytId(l.url)); return l?ytId(l.url):""; }
function coverHTML(w){
  if(w.media||w.image) return mediaHTML(w,720);
  const y=workYt(w); if(y) return `<img src="https://i.ytimg.com/vi/${esc(y)}/hqdefault.jpg" alt="" loading="lazy">`;
  return `<span class="ph">${esc((w.title||"?").trim().charAt(0))}</span>`;
}
const metaLine = w => [w.project,w.role,w.period].filter(Boolean).map(esc).join(" · ");
const pubWorks = () => works.filter(w=>w.published);

/* ---------- 방문자 화면 ---------- */
function showPublic(preview){
  previewing=!!preview;
  $("#bootMsg").hidden=true; $("#archive").hidden=true; $("#publicView").hidden=false;
  $("#pvBar").hidden=!previewing;
  $("#pubLogin").hidden=previewing || !auth;
  slideIdx=0; galIdx=0;
  renderPublic(); scrollTo({top:0});
}
function showArchive(){
  previewing=false; closeWorkView(true); document.body.classList.remove("pv-admin");
  $("#bootMsg").hidden=true; $("#publicView").hidden=true; $("#archive").hidden=false;
  document.title="레퍼런스 아카이브";
}
let pubLayout=null, slideIdx=0, galIdx=0;
function workImages(w){
  const a=[]; if(w.media||w.image) a.push({media:w.media||null,image:w.image||""});
  (w.gallery||[]).forEach(g=>a.push(g)); return a;
}
function aboutHTML(t){
  const out=[]; let para=[];
  const flush=()=>{ if(para.length){ out.push(`<p>${esc(para.join("\n"))}</p>`); para=[]; } };
  String(t||"").split("\n").forEach(line=>{
    if(/^#{1,3}\s+/.test(line)){ flush(); out.push(`<h3>${esc(line.replace(/^#{1,3}\s+/,""))}</h3>`); }
    else if(!line.trim()){ flush(); }
    else para.push(line);
  });
  flush(); return out.join("");
}
function careerHTML(c){
  const lines=String(c.body||"").split("\n").filter(x=>x.trim());
  const bullets=lines.length && lines.every(x=>/^\s*[-•·*]\s+/.test(x));
  return `<div class="car"><div class="when">${esc(c.period||"")}</div><div>
    <h3>${esc(c.company||"")}${c.role?`<span>${esc(c.role)}</span>`:""}</h3>
    ${c.summary?`<p class="sum">${esc(c.summary)}</p>`:""}
    ${lines.length?(bullets?`<ul>${lines.map(x=>`<li>${esc(x.replace(/^\s*[-•·*]\s+/,""))}</li>`).join("")}</ul>`:`<div class="txt">${esc(c.body)}</div>`):""}
  </div></div>`;
}
const DOCS={ about:{label:"자기소개서", blocks:"aboutBlocks", plain:"about"}, port:{label:"포트폴리오", blocks:"portBlocks", plain:"portText"} };
function docBlocks(P,key){ P=P||{}; if(key==="about") return aboutBlocks(P); return Array.isArray(P.portBlocks)?P.portBlocks:[]; }
function aboutBlocks(P){
  P=P||{};
  if(Array.isArray(P.aboutBlocks)) return P.aboutBlocks;
  return P.about ? [{t:"text",text:P.about}] : [];
}
function docHTML(blocks){
  return blocks.map(b=>{
    if(b.t==="text") return aboutHTML(b.text);
    if(b.media||b.image) return `<figure>${mediaHTML({media:b.media,image:b.image},1600)}${b.caption?`<figcaption>${esc(b.caption)}</figcaption>`:""}</figure>`;
    return "";
  }).join("");
}
function renderPublic(){
  if($("#publicView").hidden) return;
  const P=profile||{}, name=P.name||(CFG.portfolio&&CFG.portfolio.title)||"자기소개서";
  const admin = previewing && canEdit();
  document.body.classList.toggle("pv-admin", admin);
  document.title = P.name ? `${P.name} · 자기소개서` : name;
  $("#pName").textContent=name;
  const hl=$("#pHeadline"); hl.textContent=P.headline||""; hl.hidden=!P.headline;
  const it=$("#pIntro"); it.textContent=P.intro||""; it.hidden=!P.intro;
  const cs=parseLinks(P.contacts), ce=$("#pContacts"); ce.innerHTML=cs.map(contactHTML).join(""); ce.hidden=!cs.length;
  const blocks=aboutBlocks(P);
  if(pio) pio.disconnect();
  const d=$("#pDoc");
  d.innerHTML = blocks.length ? docHTML(blocks)
    : `<p class="ph-note">${admin?"자기소개서가 비어 있어요. ‘자기소개서 수정’을 눌러 글과 이미지를 넣어 주세요.":"준비 중이에요."}</p>`;
  wireVideos(d,pio);
  /* 포트폴리오: 내용이 있을 때만 (관리자 미리보기에서는 빈 칸도) */
  const pb=docBlocks(P,"port"), sp=$("#secPort"), pp=$("#pPort");
  sp.hidden = !pb.length && !admin;
  $("#hAbout").hidden = sp.hidden;
  pp.innerHTML = pb.length ? docHTML(pb) : `<p class="ph-note">포트폴리오가 비어 있어요. ‘포트폴리오 수정’을 눌러 작성해 주세요. 비어 있으면 방문자에게는 보이지 않아요.</p>`;
  wireVideos(pp,pio);
}
function slideMediaHTML(it, big){
  if(!it) return "";
  const fake={media:it.media, image:it.image};
  return mediaHTML(fake, big?1600:240, big);
}
function renderSlide(shown){
  const sl=$("#pSlides"), w=shown[slideIdx], imgs=workImages(w);
  if(galIdx>=imgs.length) galIdx=0;
  const main = imgs.length ? slideMediaHTML(imgs[galIdx], true) : (workYt(w)?`<img src="https://i.ytimg.com/vi/${esc(workYt(w))}/hqdefault.jpg" alt="">`:`<span class="ph">${esc((w.title||"?").charAt(0))}</span>`);
  sl.innerHTML=`<div class="slider">
    <div class="slide">
      <div class="smedia"><div class="smain">${main}</div>
        ${imgs.length>1?`<div class="sgal">${imgs.map((it,k)=>`<button type="button" data-gal="${k}" class="${k===galIdx?"on":""}" aria-label="이미지 ${k+1}">${slideMediaHTML(it,false)}</button>`).join("")}</div>`:""}</div>
      <div class="stext">
        ${metaLine(w)?`<div class="pmeta">${metaLine(w)}</div>`:""}
        <h3>${esc(w.title)}</h3>
        ${w.summary?`<p class="lead">${esc(w.summary)}</p>`:""}
        ${(w.tags||[]).length?`<div class="cell" style="display:flex;flex-wrap:wrap;gap:4px">${w.tags.map(t=>`<span class="ttag">${esc(t)}</span>`).join("")}</div>`:""}
        ${w.body?`<div class="body">${esc(w.body)}</div>`:""}
        <div class="row"><button type="button" class="btn sm" data-work="${esc(w.id)}">자세히 보기</button><button type="button" class="btn sm pv-only" data-wedit2="${esc(w.id)}">편집</button></div>
      </div>
    </div>
    <div class="sctl"><button type="button" class="btn sm" data-slide="-1" aria-label="이전 작업물">← 이전</button>
      <div class="dots">${shown.map((_,k)=>`<button type="button" data-slideto="${k}" class="${k===slideIdx?"on":""}" aria-label="${k+1}번째"></button>`).join("")}</div>
      <span class="pos">${slideIdx+1} / ${shown.length}</span>
      <button type="button" class="btn sm" data-slide="1" aria-label="다음 작업물">다음 →</button></div>
  </div>`;
  sl.querySelectorAll("video").forEach(v=>{ v.muted=true; if(v.dataset.src && !v.getAttribute("src")) v.src=v.dataset.src; const p=v.play&&v.play(); if(p) p.catch(()=>{}); });
}
function shownWorks(){ if(!$("#pSlides")) return []; const list=pubWorks(); return pubTag?list.filter(w=>(w.tags||[]).includes(pubTag)):list; }
$("#publicView").addEventListener("click",e=>{
  const t=e.target.closest("[data-wedit2],[data-pedit],[data-goto-sec],[data-layout],[data-slide],[data-slideto],[data-gal],[data-ptag],[data-work]"); if(!t) return;
  if(t.dataset.wedit2){ e.stopPropagation(); openWorkForm(works.find(w=>w.id===t.dataset.wedit2)); return; }
  if(t.dataset.pedit){ const k=t.dataset.pedit; if(k==="about") openAboutForm("about"); else if(k==="port") openAboutForm("port"); else if(k==="career") openCareerForm(); else if(k==="profile") openProfileForm(); else if(k==="addwork") openWorkForm(null); return; }
  if(t.dataset.gotoSec){ const el=$("#"+t.dataset.gotoSec); if(el) el.scrollIntoView({behavior:"smooth",block:"start"}); return; }
  if(t.dataset.layout){ pubLayout=t.dataset.layout; slideIdx=0; galIdx=0; renderPublic(); return; }
  if(t.dataset.slide){ const n=shownWorks().length; slideIdx=(slideIdx+Number(t.dataset.slide)+n)%n; galIdx=0; renderSlide(shownWorks()); return; }
  if(t.dataset.slideto){ slideIdx=Number(t.dataset.slideto); galIdx=0; renderSlide(shownWorks()); return; }
  if(t.dataset.gal){ galIdx=Number(t.dataset.gal); renderSlide(shownWorks()); return; }
  if(t.hasAttribute("data-ptag")){ pubTag=t.dataset.ptag; slideIdx=0; renderPublic(); return; }
  if(t.dataset.work) location.hash="work-"+t.dataset.work;
});
$("#publicView").addEventListener("keydown",e=>{ const c=e.target.closest&&e.target.closest("article.pcard"); if(c && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); location.hash="work-"+c.dataset.work; } });
document.addEventListener("keydown",e=>{
  if(!$("#pSlides") || $("#publicView").hidden || !$("#workView").hidden || !$("#scrim").hidden || $("#pSlides").hidden) return;
  if(/^(INPUT|TEXTAREA)$/.test(document.activeElement&&document.activeElement.tagName)) return;
  if(e.key==="ArrowRight"||e.key==="ArrowLeft"){ const n=shownWorks().length; if(!n) return; slideIdx=(slideIdx+(e.key==="ArrowRight"?1:-1)+n)%n; galIdx=0; renderSlide(shownWorks()); }
});
$("#pubLogin").addEventListener("click",()=>{ if(auth) openLogin(); });
$("#pvBack").addEventListener("click",()=>{ showArchive(); render(); });

/* ---------- 작업물 상세 (#work-ID) ---------- */
function renderWorkView(id){
  const list=pubWorks(), k=list.findIndex(w=>w.id===id), wv=$("#workView");
  if(k<0){ if(worksLoaded||mode==="local") closeWorkView(); return; }
  const w=list[k], prev=list[k-1], next=list[k+1], y=workYt(w);
  const links=(w.links||[]).filter(l=>!(y && ytId(l.url)===y && !l.label));
  wv.innerHTML=`<div class="wvin">
    <div class="wvbar"><button type="button" class="btn sm" data-wclose>← 목록</button>
      <div class="nav">${(previewing&&canEdit())?`<button type="button" class="btn sm" data-wedit3="${esc(w.id)}">편집</button>`:""}<button type="button" class="btn sm" data-wgo="${prev?esc(prev.id):""}" ${prev?"":"disabled"}>이전</button><button type="button" class="btn sm" data-wgo="${next?esc(next.id):""}" ${next?"":"disabled"}>다음</button></div></div>
    ${(w.media||w.image)?`<div class="wvmedia">${mediaHTML(w,1600,true)}</div>`:""}
    <div>${metaLine(w)?`<div class="pmeta" style="margin-bottom:8px">${metaLine(w)}</div>`:""}<h1>${esc(w.title)}</h1></div>
    ${w.summary?`<p class="lead">${esc(w.summary)}</p>`:""}
    ${(w.tags||[]).length?`<div class="cell" style="display:flex;flex-wrap:wrap;gap:6px">${w.tags.map(t=>`<span class="ttag">${esc(t)}</span>`).join("")}</div>`:""}
    ${y?`<div class="yt16"><iframe src="https://www.youtube-nocookie.com/embed/${esc(y)}" title="${esc(w.title)} 영상" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`:""}
    ${w.body?`<div class="body">${esc(w.body)}</div>`:""}
    ${(w.gallery||[]).length?`<div class="wgal">${w.gallery.map(g=>slideMediaHTML(g,true)).join("")}</div>`:""}
    ${links.length?`<div class="wlinks">${links.map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(linkLabel(l))} ↗</a>`).join("")}</div>`:""}
  </div>`;
  wv.hidden=false; document.body.style.overflow="hidden"; wv.scrollTop=0;
  document.title=`${w.title} · ${(profile&&profile.name)||"포트폴리오"}`;
}
function closeWorkView(silent){
  const wv=$("#workView"); if(wv.hidden) return;
  wv.hidden=true; wv.innerHTML=""; document.body.style.overflow="";
  if(!silent && location.hash.startsWith("#work-")) history.replaceState(null,"",location.pathname+location.search);
  renderPublic();
}
function openWorkFromHash(){ const h=location.hash; if(h.startsWith("#work-") && !$("#publicView").hidden) renderWorkView(h.slice(6)); }
addEventListener("hashchange",()=>{ if(location.hash.startsWith("#work-")) openWorkFromHash(); else closeWorkView(true); });
$("#workView").addEventListener("click",e=>{
  const t=e.target.closest("[data-wclose],[data-wgo],[data-wedit3]"); if(!t) return;
  if(t.dataset.wedit3){ openWorkForm(works.find(w=>w.id===t.dataset.wedit3)); return; }
  if(t.hasAttribute("data-wclose")) closeWorkView();
  else if(t.dataset.wgo) location.hash="work-"+t.dataset.wgo;

document.addEventListener("keydown",e=>{ if(e.key==="Escape" && !$("#workView").hidden && $("#scrim").hidden) closeWorkView(); });

/* ---------- 관리자: 포트폴리오 관리 (#portfolio) ---------- */

  const P=profile||{}, blocks=docBlocks(P,key);

  $("#count").textContent=`글 ${nTxt.toLocaleString()}자 · 이미지 ${nImg}개`;
  if(io) io.disconnect();
  $("#portAdmin").innerHTML=`
    <div class="ptool"><button type="button" class="btn primary edit-only" data-wabout="${key}">${D.label} 작성</button><button type="button" class="btn edit-only" data-wprof>이름·연락처</button><button type="button" class="btn" data-wpreview>방문자 화면 보기 · 바로 수정</button></div>
    <div class="pprof"><div style="display:flex;flex-direction:column;gap:2px;min-width:0"><b>${esc(P.name||"이름 없음")}</b><span>${esc(P.headline||"방문자 화면 맨 위에 보일 이름·한 줄 소개·연락처를 ‘이름·연락처’에서 적어 주세요.")}</span></div></div>
    <div class="docbox"><div class="doc">${blocks.length?docHTML(blocks):`<p class="ph-note">아직 비어 있어요. ‘${D.label} 작성’에서 글을 쓰고, 글 사이사이에 이미지·움짤을 넣을 수 있어요.${key==="port"?" 내용이 있으면 방문자 화면에서 자기소개서 아래에 보여요.":""}</p>`}</div></div>`;
  wireVideos($("#portAdmin"));

$("#portAdmin").addEventListener("click", async e=>{
  const t=e.target.closest("[data-wabout],[data-wcareer],[data-wadd],[data-wprof],[data-wpreview],[data-wpub],[data-wmove],[data-wedit],[data-wdel],[data-zoomw]"); if(!t) return;
  if(t.hasAttribute("data-wabout")) openAboutForm(t.dataset.wabout||"about");
  else if(t.hasAttribute("data-wcareer")) openCareerForm();
  else if(t.hasAttribute("data-wadd")) openWorkForm(null);
  else if(t.hasAttribute("data-wprof")) openProfileForm();
  else if(t.hasAttribute("data-wpreview")) showPublic(true);
  else if(t.dataset.wedit) openWorkForm(works.find(w=>w.id===t.dataset.wedit));
  else if(t.dataset.wdel) confirmWorkDelete(t.dataset.wdel);
  else if(t.dataset.zoomw){ const w=works.find(x=>x.id===t.dataset.zoomw); if(w){ const lb=$("#lightbox"); lb.innerHTML=`<div class="lb">${mediaHTML(w,1280,true)}<div class="lbbar"><span>${esc(w.title)}</span><button type="button" id="lbClose">닫기</button></div></div>`; lb.hidden=false; } }
  else if(t.dataset.wpub){
    if(!canEdit()) return;
    const w=works.find(x=>x.id===t.dataset.wpub); if(!w) return;
    try{ await wstore.update(w.id,{published:!w.published, updatedAt:Date.now()}); toast(w.published?"비공개로 바꿨어요":"공개했어요"); }catch(ex){ toast(errMsg(ex)); }
  }
  else if(t.dataset.wmove){
    const [k,d]=t.dataset.wmove.split("|").map(Number), arr=works.slice(), j=k+d;
    if(j<0||j>=arr.length) return;
    [arr[k],arr[j]]=[arr[j],arr[k]];
    try{ for(let i=0;i<arr.length;i++) if(arr[i].order!==i) await wstore.update(arr[i].id,{order:i}); }catch(ex){ toast(errMsg(ex)); }
  }
});

function syncEd(){
  document.querySelectorAll("#edList [data-k]").forEach(el=>{
    const k=+el.dataset.k; if(!edBlocks[k]) return;

}
function autoGrow(ta){ ta.style.height="auto"; ta.style.height=Math.max(80,ta.scrollHeight+2)+"px"; }
function drawEd(){
  const L=$("#edList"); if(!L) return;
  const ins=k=>`<div class="ins"><button type="button" data-ins="${k}|text">+ 글</button><button type="button" data-ins="${k}|img">+ 이미지·움짤</button></div>`;

    </div>${ins(k+1)}`).join("");
  L.querySelectorAll("textarea").forEach(ta=>{ autoGrow(ta); ta.addEventListener("input",()=>autoGrow(ta)); });
  L.querySelectorAll("video").forEach(v=>{ if(v.dataset.src) v.src=v.dataset.src; v.muted=true; const p=v.play(); if(p) p.catch(()=>{}); });

async function edInsertFiles(files, at){
  const slots=files.filter(f=>/^(image|video)\//.test(f.type)).map(f=>({f, b:{t:"media",busy:"올리는 중",caption:""}}));
  edBlocks.splice(at,0,...slots.map(x=>x.b)); drawEd();
  for(const {f,b} of slots){
    try{ const it=await uploadAny(f, pc=>{ b.busy=`업로드 ${pc}%`; syncEd(); drawEd(); }); delete b.busy; Object.assign(b,it); }
    catch(ex){ syncEd(); edBlocks.splice(edBlocks.indexOf(b),1); toast(cloudErr(ex)); }
    syncEd(); drawEd();
  }
}

}
