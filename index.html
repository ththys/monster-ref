<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>몬스터 레퍼런스 아카이브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 좌측 태그 필터 레일 + 우측 스프레드시트형 레퍼런스 표. 확장 시스템/PC 도구 칩은 호버 시 공략 노트 팝오버 */
:root{
  --bg:#f3f4f6; --panel:#ffffff; --ink:#16181d; --muted:#5f6573; --line:#dde0e6; --hover:#eef0f4;
  --accent:#d9480f; --accent-ink:#ffffff;
  --t-theme:#6741d9; --t-theme-bg:#efeafe;
  --t-look:#0b7285;  --t-look-bg:#e3f4f6;
  --t-weapon:#a61e4d;--t-weapon-bg:#fce8ef;
  --t-sys:#b35900;   --t-sys-bg:#fff1dc;
  --t-pc:#1864ab;    --t-pc-bg:#e3eefb;
  --t-game:#343a40;  --t-game-bg:#e9ecef;
  --shadow:0 12px 32px rgba(20,24,33,.16);
  --ok:#1e7a34; --ok-bg:#e6f4ea;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121418; --panel:#1a1d23; --ink:#e8eaee; --muted:#9aa1ae; --line:#2b3039; --hover:#22262e;
  --accent:#ff7a3d; --accent-ink:#1a0d05;
  --t-theme:#b9a3ff; --t-theme-bg:#2a2340;
  --t-look:#66d3e0;  --t-look-bg:#15323a;
  --t-weapon:#ff8fb1;--t-weapon-bg:#3a1a26;
  --t-sys:#ffb35c;   --t-sys-bg:#3a2a14;
  --t-pc:#74b4ff;    --t-pc-bg:#172a42;
  --t-game:#ced4da;  --t-game-bg:#2a2e35;
  --shadow:0 12px 32px rgba(0,0,0,.5); --ok:#6ad08a; --ok-bg:#15301f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121418; --panel:#1a1d23; --ink:#e8eaee; --muted:#9aa1ae; --line:#2b3039; --hover:#22262e;
  --accent:#ff7a3d; --accent-ink:#1a0d05;
  --t-theme:#b9a3ff; --t-theme-bg:#2a2340;
  --t-look:#66d3e0;  --t-look-bg:#15323a;
  --t-weapon:#ff8fb1;--t-weapon-bg:#3a1a26;
  --t-sys:#ffb35c;   --t-sys-bg:#3a2a14;
  --t-pc:#74b4ff;    --t-pc-bg:#172a42;
  --t-game:#ced4da;  --t-game-bg:#2a2e35;
  --shadow:0 12px 32px rgba(0,0,0,.5); --ok:#6ad08a; --ok-bg:#15301f; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1480px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.ttl{display:flex;flex-direction:column;gap:2px}
.ttl .eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ttl h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 12px;font-weight:500}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--t-weapon)}
.btn.sm{padding:4px 9px;font-size:12px}
.mode{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:0 4px}
.mode i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.mode.cloud i{background:#2f9e44}
.mode.warn i{background:var(--accent)}
.ro #popEdit,.ro .edit-only{display:none!important}

.searchbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{flex:1 1 320px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:0 12px}
.search svg{flex:none;color:var(--muted)}
.search input{border:0;background:transparent;padding:10px 0;width:100%;outline:none}
.active-filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.active-filters .lbl{font-size:12px;color:var(--muted)}
.count{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.main{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.main{grid-template-columns:minmax(0,1fr)}}

.side{display:flex;flex-direction:column;gap:12px;position:sticky;top:max(12px,env(safe-area-inset-top,0px));max-height:calc(100vh - 24px);min-width:0}
.rail{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:16px;overflow:auto;min-height:0}
.content{display:flex;flex-direction:column;gap:12px;min-width:0}
@media (max-width:860px){.side{position:static;max-height:none}}
.group h3{margin:0 0 8px;font-size:11px;font-family:var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px}
.group h3 i{width:8px;height:8px;border-radius:2px;display:inline-block}
.group .chips{display:flex;flex-wrap:wrap;gap:5px}
.empty-note{font-size:12px;color:var(--muted)}

.tag{display:inline-flex;align-items:center;gap:4px;border:1px solid transparent;border-radius:4px;padding:1px 7px;font-size:12px;line-height:1.6;white-space:nowrap;background:var(--c-bg);color:var(--c)}
button.tag:hover{border-color:var(--c)}
.tag.on{background:var(--c);color:var(--panel)}
.tag .n{font-family:var(--f-mono);font-size:10.5px;opacity:.75;font-variant-numeric:tabular-nums}
.tag .x{font-size:13px;line-height:1}
.c-theme{--c:var(--t-theme);--c-bg:var(--t-theme-bg)}
.c-look{--c:var(--t-look);--c-bg:var(--t-look-bg)}
.c-weapon{--c:var(--t-weapon);--c-bg:var(--t-weapon-bg)}
.c-sys{--c:var(--t-sys);--c-bg:var(--t-sys-bg)}
.c-pc{--c:var(--t-pc);--c-bg:var(--t-pc-bg)}
.c-game{--c:var(--t-game);--c-bg:var(--t-game-bg)}

/* 상세 노트를 가진 칩: 점선 밑줄 + 노트 표시 점 */
.deep{border:1px dashed var(--c);font-weight:600;cursor:help}
.deep.has::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--c);margin-left:2px}

.tablebox{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;min-width:1080px}
th,td{text-align:left;vertical-align:top;padding:10px 10px;border-bottom:1px solid var(--line)}
th{font-size:11px;font-family:var(--f-mono);letter-spacing:.06em;color:var(--muted);font-weight:500;background:var(--panel);position:sticky;top:0;white-space:nowrap}
tbody tr:hover{background:var(--hover)}
tbody tr:last-child td{border-bottom:0}
td .cell{display:flex;flex-wrap:wrap;gap:4px}
td.game{white-space:nowrap;color:var(--muted);font-size:13px}
td.name{font-weight:600;min-width:120px}
.thumb{width:84px;height:84px;border-radius:6px;background:var(--hover);border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;padding:0}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.thumb span{text-align:center;padding:0 4px}
.thumb span{font-size:11px;color:var(--muted)}
.link{color:var(--accent);font-weight:500;text-decoration:none;white-space:nowrap}
.link:hover{text-decoration:underline}
.linkcell{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.lstate{font-size:11px;font-family:var(--f-mono);color:var(--muted);white-space:nowrap}
.lstate.dead{color:var(--t-weapon);font-weight:500}
.lstate.ok{color:#2f9e44}
.thumb .yt{position:relative;width:100%;height:100%}
.thumb .yt::after{content:"▶";position:absolute;right:4px;bottom:3px;font-size:10px;color:#fff;background:rgba(0,0,0,.6);border-radius:3px;padding:0 4px}
#deadBtn{color:var(--t-weapon);border-color:var(--t-weapon)}
.rowact{display:flex;gap:4px;opacity:.55}
tr:hover .rowact,.rowact:focus-within{opacity:1}
.iconbtn{border:0;background:transparent;padding:4px 6px;border-radius:4px;color:var(--muted);font-size:12px}
.iconbtn:hover{background:var(--line);color:var(--ink)}

.state{padding:48px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.state strong{color:var(--ink);font-size:15px}

/* 팝오버 */
.pop{position:fixed;z-index:50;width:min(420px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.pop .crumb{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:9px 12px;font-size:12px;background:var(--hover);border-bottom:1px solid var(--line);color:var(--muted)}
.pop .crumb b{color:var(--ink);font-weight:600}
.pop .crumb .sep{opacity:.5}
.pop .crumb .root{color:var(--c);font-weight:600}
.pop .crumb input{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:1px 6px;width:9em;font-size:12px}
.pop .body{padding:12px;white-space:pre-wrap;font-size:13.5px;line-height:1.65;max-height:320px;overflow:auto}
.pop .body.blank{color:var(--muted);font-style:italic}
.pop textarea{border:0;border-top:1px solid var(--line);background:var(--panel);padding:12px;min-height:160px;resize:vertical;font-size:13.5px;line-height:1.6;outline:none}
.pop .foot{display:flex;justify-content:flex-end;gap:6px;padding:8px 12px;border-top:1px solid var(--line)}
.pop .foot .hint{margin-right:auto;font-size:11.5px;color:var(--muted);align-self:center}

/* 모달 */
.scrim{position:fixed;inset:0;z-index:68;background:rgba(10,12,16,.45);display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);border-radius:12px;width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:var(--shadow);display:flex;flex-direction:column}
.modal header{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal header h2{margin:0;font-size:16px}
.modal form{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.modal form{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
.field label i{width:8px;height:8px;border-radius:2px;display:inline-block}
.field small{font-size:11.5px;color:var(--muted)}
.field input[type=text],.field input[type=url]{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 10px;width:100%}
.drop{border:1px dashed var(--line);border-radius:8px;padding:12px;display:flex;gap:12px;align-items:center;background:var(--bg)}
.drop.over{border-color:var(--accent)}
.imgurl{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 10px;width:100%;margin-top:6px}
.notice{grid-column:1/-1;font-size:12.5px;background:var(--hover);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.notice .row{display:flex;gap:6px;flex-wrap:wrap}
.drop .thumb{flex:none}
.drop .txt{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.modal .foot{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px;padding-top:4px}
.err{color:var(--t-weapon);font-size:12px;grid-column:1/-1}

.lightbox{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.85);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));cursor:zoom-out}
.lightbox .lb{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:100%;cursor:default}
.lightbox img,.lightbox video{max-width:min(1200px,100%);max-height:calc(100vh - 120px);border-radius:8px;background:#000}
.lightbox .lbbar{display:flex;gap:14px;align-items:center;color:#d6d9df;font-size:13px}
.lightbox .lbbar a,.lightbox .lbbar button{color:#fff;background:none;border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:5px 10px;text-decoration:none;font-size:13px}

/* 방문자용 포트폴리오 화면 */
.pub{display:flex;flex-direction:column;gap:20px;max-width:1240px;margin:0 auto;padding-bottom:40px}
.pvbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--t-sys-bg);color:var(--t-sys);border:1px solid var(--t-sys);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:500}
.phead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:12px}
.phead .eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.phead h1{margin:6px 0 0;font-size:clamp(28px,4.4vw,44px);font-weight:700;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
.phead .headline{margin:8px 0 0;font-size:16px;color:var(--muted);max-width:60ch}
.pub .intro{margin:0;white-space:pre-wrap;line-height:1.75;font-size:15px;max-width:68ch}
.contacts{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13.5px}
.contacts span b{font-weight:600;color:var(--muted);margin-right:6px;font-size:12px;font-family:var(--f-mono)}
.contacts a{color:var(--ink)}
.ptags{display:flex;flex-wrap:wrap;gap:6px}
.ptags button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:13px}
.ptags button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:18px}
.pcard{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-align:left;padding:0;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}
.pcard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.pcover{aspect-ratio:16/9;background:var(--hover);overflow:hidden;display:grid;place-items:center;max-width:100%}
.pcover img,.pcover video{width:100%;height:100%;object-fit:cover;display:block}
.pcover .ph{font-size:40px;font-weight:700;color:var(--line)}
.pcard .pb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pmeta{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.pcard h3{margin:0;font-size:17px;line-height:1.35;text-wrap:balance}
.pcard p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard .cell{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.ttag{font-size:11.5px;border-radius:4px;padding:1px 7px;background:var(--hover);color:var(--muted)}
.pub .empty{padding:60px 20px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:12px}
/* 방문자 화면: 섹션 */
.psnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-left,0px))}
.psnav button{border:0;background:none;padding:12px 12px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.psnav button:hover{color:var(--ink)}
.psnav button.on{color:var(--ink);border-bottom-color:var(--accent)}
.psec{display:flex;flex-direction:column;gap:16px;scroll-margin-top:56px;padding-top:8px}
.sh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sh h2{margin:0;font-size:22px;letter-spacing:-.01em}
.sh .num{font-family:var(--f-mono);font-size:12px;color:var(--accent)}
.sh .sp{flex:1}
.pv-only{display:none!important}
.pv-admin .pv-only{display:inline-flex!important}
.about{max-width:72ch;display:flex;flex-direction:column;gap:12px;font-size:15px;line-height:1.85}
.about h3{margin:14px 0 0;font-size:17px}
.about h3:first-child{margin-top:0}
.about p{margin:0;white-space:pre-wrap}
.ph-note{color:var(--muted);font-style:italic}
.careers{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.car{display:grid;grid-template-columns:180px minmax(0,1fr);gap:18px;padding:18px 0;border-bottom:1px solid var(--line)}
@media (max-width:640px){.car{grid-template-columns:minmax(0,1fr);gap:6px}}
.car .when{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);padding-top:3px;font-variant-numeric:tabular-nums}
.car h3{margin:0;font-size:17px}
.car h3 span{font-weight:500;color:var(--muted);font-size:14px;margin-left:6px}
.car .sum{margin:6px 0 0;color:var(--muted);font-size:14px}
.car ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14.5px;line-height:1.65}
.car .txt{margin:8px 0 0;white-space:pre-wrap;font-size:14.5px;line-height:1.7}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 12px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--panel)}
.pcard{position:relative}
.pcard .pedit{position:absolute;top:8px;right:8px;z-index:2}
/* 슬라이드 보기 */
.slider{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.slide{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);min-height:440px}
@media (max-width:860px){.slide{grid-template-columns:minmax(0,1fr)}}
.smedia{background:#0d0f13;display:flex;flex-direction:column;min-width:0}
.smain{flex:1;display:grid;place-items:center;min-height:300px;aspect-ratio:16/10;max-width:100%}
.smain img,.smain video{width:100%;height:100%;object-fit:contain;display:block;max-height:62vh}
.smain .ph{font-size:64px;font-weight:700;color:#3a3f48}
.sgal{display:flex;gap:6px;padding:8px;overflow-x:auto;background:#0d0f13}
.sgal button{flex:none;width:72px;height:48px;padding:0;border:2px solid transparent;border-radius:5px;overflow:hidden;background:#222;opacity:.6}
.sgal button.on{border-color:var(--accent);opacity:1}
.sgal img,.sgal video{width:100%;height:100%;object-fit:cover;display:block}
.stext{padding:22px 24px;display:flex;flex-direction:column;gap:10px;min-width:0;overflow:auto;max-height:70vh}
.stext h3{margin:0;font-size:22px;line-height:1.3;text-wrap:balance}
.stext .lead{margin:0;color:var(--muted);font-size:15px;line-height:1.6}
.stext .body{white-space:pre-wrap;font-size:14px;line-height:1.75}
.stext .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.sctl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}

  <header class="phead">
    <div><div class="eyebrow">자기소개서</div><h1 id="pName">자기소개서</h1><p class="headline" id="pHeadline" hidden></p></div>

<script>
(() => {
const CATS = [
  {key:"game",   label:"게임",            cls:"c-game"},
  {key:"theme",  label:"테마",            cls:"c-theme"},
  {key:"looks",  label:"외형",            cls:"c-look"},
  {key:"weapons",label:"무기",            cls:"c-weapon"},
  {key:"systems",label:"전투 확장 시스템", cls:"c-sys", deep:true, root:"몬스터 전투 확장 시스템"},
  {key:"pcs",    label:"대응 PC 도구",     cls:"c-pc",  deep:true, root:"대응 PC 도구"},
];
const CAT = Object.fromEntries(CATS.map(c=>[c.key,c]));
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const splitTags = s => String(s||"").split(/[\/,·]/).map(t=>t.trim()).filter(Boolean);

const STORE_KEY = "monster-ref-v1";
const MAX_ANIM_KB = 700; /* Firestore 문서 1MB 제한 안에 들도록 */
const SEED = [{id:"zzz-primordial-nightmare",game:"젠레스 존 제로",name:"태초의 악몽",
  theme:["변이","비행기","빠름","에너지"],looks:["인간형","여성","건담"],weapons:["에너지","검"],
  systems:[{name:"제어기",label:"공략",note:"극한 회피 또는 극한 지원을 시전하여 제어기를 피해 회피\n- N회 성공 시 피해량을 줌\n- 이때 유저는 궁극기를 사용 못함\n- 태그 게이지를 무한으로 사용 가능"}],
  pcs:[{name:"엽빛나",label:"공략",note:""}],link:"",image:"",createdAt:1793786300000,updatedAt:1793786300000}];
const uid = () => "m" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function persist(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(monsters)); return true; }
  catch(e){ toast("브라우저 저장 공간이 가득 찼어요. 내보내기로 백업한 뒤 이미지를 줄여 주세요"); return false; }
}
function commit(next){
  const prev = monsters;
  monsters = next.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  if(!persist()){ monsters = prev; throw new Error("quota"); }
  render();
  if(popKey && !editing){ drawPop(false); place(); }
}
/* ---------- 저장소: Firebase 설정이 있으면 클라우드, 없으면 이 브라우저 ---------- */
const CFG = window.REF_CONFIG || {};
const EDITORS = (CFG.editors||[]).map(e=>String(e).trim().toLowerCase()).filter(e=>e && !e.includes("본인"));
let mode = "local", fs = null, auth = null, user = null;
const COL = () => fs.collection("monsters");
const clean = d => { const o={...d}; delete o.id; return o; };
function fbConfigured(){ const f=CFG.firebase; return !!(f && f.apiKey && f.projectId && !/붙여|여기/.test(f.apiKey)); }
function canEdit(){
  if (mode==="local") return true;
  if (!user) return false;
  return !EDITORS.length || EDITORS.includes((user.email||"").toLowerCase());
}
const store = {
  async update(id, patch){ if(mode==="cloud") return COL().doc(id).update(patch); commit(monsters.map(m=>m.id===id?{...m,...patch}:m)); },
  async set(id, data){ if(mode==="cloud") return COL().doc(id).set(clean(data)); commit(monsters.filter(m=>m.id!==id).concat({...data,id})); },
  async add(data){ const id=uid(); if(mode==="cloud") return COL().doc(id).set(clean(data)); commit(monsters.concat({...data,id})); },
  async remove(id){ if(mode==="cloud") return COL().doc(id).delete(); commit(monsters.filter(m=>m.id!==id)); },
  async bulk(arr){
    if(mode==="cloud"){
      for(let i=0;i<arr.length;i+=20){ const b=fs.batch(); arr.slice(i,i+20).forEach(m=>b.set(COL().doc(m.id),clean(m))); await b.commit(); }
      return;
    }
    const byId=new Map(monsters.map(m=>[m.id,m])); arr.forEach(m=>byId.set(m.id,m)); commit([...byId.values()]);
  },
};
function errMsg(ex){
  const c=ex&&ex.code||"";
  if(c==="permission-denied") return "수정 권한이 없어요. 관리자 계정으로 로그인해 주세요";
  if(c==="invalid-argument"||/size|large/i.test(ex&&ex.message||"")) return "데이터가 너무 커요. 이미지를 더 작은 것으로 바꿔 주세요";
  if(c==="unavailable") return "인터넷 연결을 확인해 주세요";
  if(ex&&ex.message==="quota") return "브라우저 저장 공간이 가득 찼어요";
  return "저장하지 못했어요. 다시 시도해 주세요";
}
function applyMode(){
  document.body.classList.toggle("ro", !canEdit());
  const m=$("#mode"), a=$("#authBtn");
  if(mode==="cloud"){
    m.className="mode cloud";
    m.lastElementChild.textContent = user ? (canEdit()? "동기화 중 · "+(user.email||"") : "보기 전용 · 편집 권한 없는 계정") : "동기화 중 · 보기 전용";

/* 이미지는 최대 640px JPEG로 줄여 데이터 안에 함께 저장 */
function shrink(file, max=640){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=rej;
    fr.onload=()=>{ const im=new Image(); im.onerror=rej; im.onload=()=>{
      const k=Math.min(1,max/Math.max(im.width,im.height));
      const c=document.createElement("canvas"); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
      const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(im,0,0,c.width,c.height);
      res(c.toDataURL("image/jpeg",0.82)); }; im.src=fr.result; };
    fr.readAsDataURL(file);
  });
}

/* 움직이는 GIF·WEBP인지 파일 헤더로 판별 */
async function isAnimated(file){
  const t=(file.type||"").toLowerCase();
  if(!/gif|webp|png/.test(t)) return false;
  const b=new Uint8Array(await file.arrayBuffer());
  const str=(o,n)=>String.fromCharCode(...b.subarray(o,o+n));
  if(str(0,3)==="GIF"){ let n=0; for(let k=0;k<b.length-2;k++){ if(b[k]===0x21&&b[k+1]===0xF9&&b[k+2]===0x04 && ++n>1) return true; } return false; }
  if(str(0,4)==="RIFF"&&str(8,4)==="WEBP"){ return str(12,4)==="VP8X" && (b[20]&0x02)===0x02; }
  if(b[0]===0x89&&str(1,3)==="PNG"){ const lim=Math.min(b.length-4,4096); for(let k=8;k<lim;k++){ if(str(k,4)==="acTL") return true; if(str(k,4)==="IDAT") return false; } }
  return false;
}

        <span class="row"><button type="button" class="btn sm" id="nStill">정지 이미지로 저장</button><button type="button" class="btn sm" id="nCancel">취소</button></span>`;

      return;

}
function cloudUpload(t, blob, rt, onp){
  return new Promise((res,rej)=>{
    const fd=new FormData(); fd.append("file", blob, blob.name||"upload"); fd.append("upload_preset", t.uploadPreset);
    const x=new XMLHttpRequest();
    x.open("POST", `https://api.cloudinary.com/v1_1/${encodeURIComponent(t.cloudName)}/${rt}/upload`);
    x.upload.onprogress=e=>{ if(e.lengthComputable) onp(Math.round(e.loaded/e.total*100)); };
    x.onload=()=>{ let j={}; try{ j=JSON.parse(x.responseText); }catch{}
      if(x.status>=200&&x.status<300) res(j); else rej({status:x.status, detail:(j.error&&j.error.message)||""}); };
    x.onerror=()=>rej({msg:"인터넷 연결을 확인해 주세요"});
    x.send(fd);
  });
}
function cloudErr(ex){
  if(ex&&ex.msg) return ex.msg;
  const d=(ex&&ex.detail)||"";
  if(/preset/i.test(d)) return "업로드 설정 이름(uploadPreset)을 확인해 주세요. Cloudinary에서 Unsigned로 만들어야 해요";
  if(/cloud name|Invalid cloud/i.test(d)) return "Cloudinary 클라우드 이름(cloudName)을 확인해 주세요";
  if(/size|too large/i.test(d)) return "파일이 너무 커요. 이미지 10MB, 영상 100MB까지 올릴 수 있어요";
  if(ex&&(ex.status===420||ex.status===429)||/limit|quota|exceed/i.test(d)) return "Cloudinary 무료 한도에 걸렸어요. config.js에 계정을 하나 더 추가해 주세요";
  return "업로드하지 못했어요"+(d?": "+d:"");
}
/* 10MB 넘는 움직이는 GIF·WEBP를 브라우저에서 영상으로 변환 (크롬·엣지) */
async function animToVideo(file, onp){
  if(!("ImageDecoder" in window) || !window.MediaRecorder || !HTMLCanvasElement.prototype.captureStream)
    throw {msg:`이 GIF는 ${MB(file.size)}MB라 영상으로 바꿔 올려야 하는데, 이 브라우저는 변환을 지원하지 않아요. 크롬이나 엣지에서 올려 주세요`};
  const mime=["video/mp4;codecs=avc1","video/mp4","video/webm;codecs=vp9","video/webm"].find(t=>MediaRecorder.isTypeSupported(t));
  if(!mime) throw {msg:"이 브라우저는 영상 변환을 지원하지 않아요. 크롬이나 엣지에서 올려 주세요"};
  const dec=new ImageDecoder({data:file.stream(), type:file.type||"image/gif"});
  await dec.completed; await dec.tracks.ready;
  const n=dec.tracks.selectedTrack.frameCount;
  const f0=(await dec.decode({frameIndex:0})).image;
  const k=Math.min(1, 960/Math.max(f0.displayWidth,f0.displayHeight));
  const W=Math.max(2,Math.round(f0.displayWidth*k/2)*2), H=Math.max(2,Math.round(f0.displayHeight*k/2)*2);
  f0.close();
  const c=document.createElement("canvas"); c.width=W; c.height=H; const g=c.getContext("2d");
  g.fillStyle="#fff"; g.fillRect(0,0,W,H);
  const rec=new MediaRecorder(c.captureStream(30),{mimeType:mime, videoBitsPerSecond:3000000});
  const chunks=[]; rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
  const stopped=new Promise(res=>rec.onstop=res);
  rec.start(250);
  for(let i=0;i<n;i++){
    const fr=(await dec.decode({frameIndex:i})).image;
    g.fillRect(0,0,W,H); g.drawImage(fr,0,0,W,H);
    const ms=Math.max(20,(fr.duration||100000)/1000); fr.close();
    onp(Math.round((i+1)/n*100));
    await new Promise(res=>setTimeout(res,ms));
  }
  rec.stop(); await stopped; dec.close();
  const type=mime.split(";")[0];
  return new File([new Blob(chunks,{type})], (file.name||"clip").replace(/\.\w+$/,"")+(type.includes("mp4")?".mp4":".webm"), {type});
}
async function upload(file){
  const target=upTarget();
  if(!target) return uploadInline(file);
  if(uploading) return;
  const err=$("#fErr"), note=$("#fNotice"); err.hidden=true; note.hidden=true;
  uploading=true; setThumb("확인 중…");
  try{
    const isVid=/^video\//.test(file.type||"");
    let rt="image", send=file, anim=false;
    if(isVid){
      rt="video";
      if(file.size>VID_MAX) throw {msg:`영상이 ${MB(file.size)}MB예요. 100MB까지 올릴 수 있어요`};
    } else {
      anim=await isAnimated(file);
      if(file.size>IMG_MAX){
        if(anim){ send=await animToVideo(file, p=>setThumb(`영상 변환 ${p}%`)); rt="video"; anim=false; }
        else { const blob=await (await fetch(await shrink(file,2400))).blob(); send=new File([blob],"image.jpg",{type:"image/jpeg"}); }
      }
    }
    const res=await cloudUpload(target, send, rt, p=>setThumb(`업로드 ${p}%`));
    formMedia={cloud:target.cloudName, rt:res.resource_type||rt, id:res.public_id, fmt:res.format||"", anim:(res.resource_type||rt)==="image"&&anim, bytes:res.bytes||send.size};
    formImage=null; $("#f_imgurl").value="";
    uploading=false; setThumb();
  }catch(ex){
    uploading=false; setThumb();
    err.hidden=false; err.textContent=cloudErr(ex);
  }
}

function drawEd(){

    </div>${ins(k+1)}`).join("");

async function edInsertFiles(files, at){
  const slots=files.filter(f=>/^(image|video)\//.test(f.type)).map(f=>({f, b:{t:"media",busy:"올리는 중",caption:""}}));
  edBlocks.splice(at,0,...slots.map(x=>x.b)); drawEd();
  for(const {f,b} of slots){
    try{ const it=await uploadAny(f, pc=>{ b.busy=`업로드 ${pc}%`; syncEd(); drawEd(); }); delete b.busy; Object.assign(b,it); }
    catch(ex){ syncEd(); edBlocks.splice(edBlocks.indexOf(b),1); toast(cloudErr(ex)); }
    syncEd(); drawEd();
  }
}

let formGallery=[], galBusy=0;
async function uploadAny(file, onp){
  const target=upTarget();
  if(!target){
    if(await isAnimated(file) && file.size<=MAX_ANIM_KB*1024) return {image:await readURL(file)};
    return {image:await shrink(file,1280)};
  }
  const isVid=/^video\//.test(file.type||"");
  let rt="image", send=file, anim=false;
  if(isVid){ rt="video"; if(file.size>VID_MAX) throw {msg:`영상이 ${MB(file.size)}MB예요. 100MB까지 올릴 수 있어요`}; }
  else {
    anim=await isAnimated(file);
    if(file.size>IMG_MAX){
      if(anim){ send=await animToVideo(file,onp); rt="video"; anim=false; }
      else { const blob=await (await fetch(await shrink(file,2400))).blob(); send=new File([blob],"image.jpg",{type:"image/jpeg"}); }
    }
  }
  const res=await cloudUpload(target, send, rt, onp);
  return {media:{cloud:target.cloudName, rt:res.resource_type||rt, id:res.public_id, fmt:res.format||"", anim:(res.resource_type||rt)==="image"&&anim, bytes:res.bytes||send.size}};
}
function galleryFieldHTML(){
  return `<div class="field full"><label>추가 이미지 <small style="font-weight:400">· 슬라이드에서 넘겨 보고, 상세 화면에 차례로 보여요</small></label>
    <div class="galedit" id="galEdit"></div>
    <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><label class="btn sm" for="g_files" style="font-weight:500">이미지 여러 장 추가</label><input id="g_files" type="file" multiple accept="image/png,image/jpeg,image/gif,image/webp,video/mp4,video/webm" hidden><small>또는 이 칸 위로 끌어 놓기</small></div></div>`;
}
function drawGallery(){
  const el=$("#galEdit"); if(!el) return;
  el.innerHTML=formGallery.map((g,k)=>`<div class="gi">${g.busy?`<span>${esc(g.busy)}</span>`:slideMediaHTML(g,false)}${g.busy?"":`<button type="button" data-grm="${k}" aria-label="빼기">✕</button>`}</div>`).join("") || `<small style="color:var(--muted)">없음</small>`;
  el.querySelectorAll("video").forEach(v=>{ if(v.dataset.src) v.src=v.dataset.src; v.muted=true; v.play().catch(()=>{}); });
  const sv=$("#fSave"); if(sv) sv.disabled = uploading || galBusy>0;
}
async function addGalleryFiles(files){
  for(const f of [...files].filter(f=>/^(image|video)\//.test(f.type))){
    const slot={busy:"올리는 중"}; formGallery.push(slot); galBusy++; drawGallery();
    try{ const it=await uploadAny(f, p=>{ slot.busy=`${p}%`; drawGallery(); }); delete slot.busy; Object.assign(slot,it); }
    catch(ex){ formGallery.splice(formGallery.indexOf(slot),1); toast(cloudErr(ex)); }
    galBusy--; drawGallery();
  }
}
function wireGallery(){
  drawGallery();
  $("#g_files").onchange=e=>{ addGalleryFiles(e.target.files); e.target.value=""; };
  const z=$("#galEdit").parentElement;
  z.ondragover=e=>{ e.preventDefault(); };
  z.ondrop=e=>{ e.preventDefault(); e.stopPropagation(); addGalleryFiles(e.dataTransfer.files); };
  $("#galEdit").onclick=e=>{ const b=e.target.closest("[data-grm]"); if(b){ formGallery.splice(+b.dataset.grm,1); drawGallery(); } };
}
function confirmWorkDelete(id){

  const sc=$("#scrim");
  sc.innerHTML=`<div class="modal" role="dialog" aria-modal="true" style="width:min(380px,100%)"><header><h2>작업물 삭제</h2></header>
    <div style="padding:16px 18px"><b>${esc(w.title)}</b>을(를) 삭제할까요?</div>
    <div class="foot" style="display:flex;justify-content:flex-end;gap:8px;padding:0 18px 16px"><button type="button" class="btn" id="dNo">취소</button><button type="button" class="btn primary" id="dYes">삭제</button></div></div>`;

}

/* ---------- 백업 (ZIP 한 번에) / 복원 ---------- */
const ZIPLIB="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";
const safeName = s => String(s||"").replace(/[\\/:*?"<>|\s]+/g,"_").slice(0,40);
function saveBlob(blob, name){
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function jsonBackup(list, wl, pf){
  const ou=o=>({...o, originalUrl:origUrl(o).startsWith("data:")?"":origUrl(o)});
  const p=pf||profile;
  return {version:4, exportedAt:new Date().toISOString(), monsters:list.map(ou), works:(wl||works).map(ou),
          profile:{...p, aboutBlocks:(p.aboutBlocks||[]).map(b=>b.t==="text"?b:ou(b))}};
}
let busy=false;
$("#exportBtn").addEventListener("click", async ()=>{
  if(busy) return; busy=true;
  const stamp=new Date().toISOString().slice(0,10);
  try{
    if(!window.JSZip) await loadScript(ZIPLIB);
    const zip=new JSZip(), failed=[];
    const list=monsters.map(m=>({...m}));
    const wl=works.map(w=>({...w}));
    const pf={...profile, aboutBlocks:aboutBlocks(profile).map(b=>({...b}))};
    const hasFile=o=>o.media||(o.image&&!o.image.startsWith("data:"));
    const targets=[...list.filter(hasFile).map(o=>({o,name:`${safeName(o.game)}_${safeName(o.name)}`,label:`${o.game} · ${o.name}`})),
                   ...wl.filter(hasFile).map(o=>({o,name:`portfolio_${safeName(o.title)}`,label:`포트폴리오 · ${o.title}`})),
                   ...pf.aboutBlocks.map((o,k)=>({o:Object.assign(o,{id:o.id||("b"+k)}),k})).filter(x=>x.o.t!=="text"&&hasFile(x.o)).map(({o,k})=>({o,name:`자기소개서_${String(k+1).padStart(2,"0")}`,label:`자기소개서 이미지 ${k+1}`}))];
    let done=0;
    for(const {o,name,label} of targets){
      const url=origUrl(o);
      try{
        const r=await fetch(url,{mode:"cors"}); if(!r.ok) throw 0;
        const b=await r.blob();
        const ext=(o.media&&o.media.fmt)||((b.type.split("/")[1]||"bin").replace("jpeg","jpg"));
        const path=`media/${name}_${o.id}.${ext}`;
        zip.file(path,b); o.mediaFile=path;
      }catch{ failed.push(`${label}\t${url}`); }
      toast(`백업 중… 파일 ${++done}/${targets.length}`);
    }
    zip.file("data.json", JSON.stringify(jsonBackup(list,wl,pf),null,2));
    if(failed.length) zip.file("가져오지_못한_파일.txt", "아래 파일은 원본 사이트에서 받지 못했어요. 주소로 직접 열어 저장해 주세요.\n\n"+failed.join("\n"));
    toast("압축하는 중…");
    saveBlob(await zip.generateAsync({type:"blob"}), `monster-ref-backup-${stamp}.zip`);
    toast(`백업을 내려받았어요 · 레퍼런스 ${list.length}건 · 작업물 ${wl.length}건${failed.length?` (파일 ${failed.length}개는 주소만 저장)`:""}`);
  }catch{
    saveBlob(new Blob([JSON.stringify(jsonBackup(monsters),null,2)],{type:"application/json"}), `monster-ref-${stamp}.json`);
    toast("압축 도구를 불러오지 못해 데이터(JSON)만 받았어요");
  }finally{ busy=false; }
});
$("#importBtn").addEventListener("click", ()=>{ if(!busy) $("#importFile").click(); });
$("#importFile").addEventListener("change", async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f||busy) return;
  busy=true;
  try{
    let j, zip=null;
    if(/\.zip$/i.test(f.name)||f.type.includes("zip")){
      if(!window.JSZip) await loadScript(ZIPLIB);
      zip=await JSZip.loadAsync(f);
      const dj=zip.file("data.json"); if(!dj) throw 0;
      j=JSON.parse(await dj.async("string"));
    } else j=JSON.parse(await f.text());
    const arr=Array.isArray(j)?j:(j.monsters||[]);
    if(!Array.isArray(arr)) throw 0;
    const list=arr.filter(m=>m&&m.name).map(m=>{ const o={...m,id:m.id||uid()}; delete o.originalUrl; return o; });
    const wl=(Array.isArray(j.works)?j.works:[]).filter(w=>w&&w.title).map(w=>{ const o={...w,id:w.id||uid()}; delete o.originalUrl; return o; });
    if(!list.length && !wl.length) throw 0;
    /* ZIP 복원: 원본 파일을 지금 연결된 Cloudinary 계정에 다시 올림 */
    const target=upTarget(); let re=0, reFail=0;
    if(zip && target){
      const pfb=(j.profile&&Array.isArray(j.profile.aboutBlocks))?j.profile.aboutBlocks:[];
      const withFile=[...list,...wl,...pfb].filter(m=>m.mediaFile&&zip.file(m.mediaFile));
      for(const m of withFile){
        try{
          const b=await zip.file(m.mediaFile).async("blob");
          const ext=m.mediaFile.split(".").pop().toLowerCase();
          const isVid=/^(mp4|webm|mov)$/.test(ext) || (m.media&&m.media.rt==="video");
          const typ=isVid?`video/${ext==="mov"?"quicktime":ext}`:`image/${ext==="jpg"?"jpeg":ext}`;
          const file=new File([b], m.mediaFile.split("/").pop(), {type:typ});
          if(!isVid && file.size>IMG_MAX) throw 0;
          const res=await cloudUpload(target, file, isVid?"video":"image", ()=>{});
          m.media={cloud:target.cloudName, rt:res.resource_type, id:res.public_id, fmt:res.format||ext, anim:res.resource_type==="image"&&await isAnimated(file), bytes:res.bytes||file.size};
          m.image=""; re++;
        }catch{ reFail++; }
        toast(`복원 중… 파일 ${re+reFail}/${withFile.length}`);
      }
    }
    [...list,...wl,...((j.profile&&j.profile.aboutBlocks)||[])].forEach(m=>{ delete m.mediaFile; delete m.originalUrl; });
    toast("데이터를 저장하는 중…");
    try{
      if(list.length) await store.bulk(list);
      for(const w of wl) await wstore.set(w.id, clean(w));
      if(j.profile && typeof j.profile==="object" && Object.keys(j.profile).length){ const pf={...j.profile}; if(Array.isArray(pf.aboutBlocks)) pf.aboutBlocks=pf.aboutBlocks.map(b=>{ const o={...b}; delete o.id; return o; }); await wstore.saveProfile(pf); }
      toast(`레퍼런스 ${list.length}건 · 작업물 ${wl.length}건을 불러왔어요${re?` · 파일 ${re}개 다시 올림`:""}${reFail?` · ${reFail}개 실패`:""}`);
    }catch(ex){ toast(errMsg(ex)); }
  }catch{ toast("불러올 수 없는 파일이에요. 백업으로 받은 ZIP이나 JSON인지 확인해 주세요"); }
  finally{ busy=false; }
});

/* ---------- boot ---------- */
const FB = "https://www.gstatic.com/firebasejs/10.12.2/";
const loadScript = src => new Promise((res,rej)=>{ const el=document.createElement("script"); el.src=src; el.onload=res; el.onerror=rej; document.head.appendChild(el); });

$("#authBtn").addEventListener("click", async ()=>{
  if(!auth) return;
  if(user){ await auth.signOut(); toast("로그아웃했어요"); return; }
  openLogin();
});
/* 로그인 창: 구글 또는 이메일·비밀번호 (구글 로그인이 막힌 회사망용) */
function openLogin(){
  const sc=$("#scrim");
  sc.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="lTitle" style="width:min(400px,100%)">
    <header><h2 id="lTitle">관리자 로그인</h2><button type="button" class="iconbtn" id="lClose" aria-label="닫기">✕</button></header>
    <div style="padding:16px 18px;display:flex;flex-direction:column;gap:14px">
      <button type="button" class="btn" id="lGoogle" style="padding:10px">구글 계정으로 로그인</button>
      <div style="display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px"><span style="flex:1;height:1px;background:var(--line)"></span>또는 이메일로<span style="flex:1;height:1px;background:var(--line)"></span></div>
      <form id="lForm" novalidate style="display:flex;flex-direction:column;gap:10px">
        <div class="field"><label for="l_email">이메일</label><input id="l_email" type="text" inputmode="email" autocomplete="username" style="border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 10px"></div>
        <div class="field"><label for="l_pw">비밀번호</label><input id="l_pw" type="password" autocomplete="current-password" style="border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 10px"></div>
        <div class="err" id="lErr" hidden></div>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
          <button type="button" class="iconbtn" id="lReset">비밀번호를 잊었어요</button>
          <button type="submit" class="btn primary" id="lGo">로그인</button>
        </div>
      </form>
    </div></div>`;
  sc.hidden=false;
  const err=$("#lErr"), show=t=>{ err.hidden=false; err.textContent=t; };
  $("#lClose").onclick=closeForm; sc.onclick=e=>{ if(e.target===sc) closeForm(); };
  $("#lGoogle").onclick=async()=>{
    const p=new firebase.auth.GoogleAuthProvider();
    try{ await auth.signInWithPopup(p); closeForm(); toast("로그인했어요"); }
    catch(ex){
      if(ex&&(ex.code==="auth/popup-blocked"||ex.code==="auth/operation-not-supported-in-this-environment")) auth.signInWithRedirect(p);
      else if(ex&&ex.code==="auth/unauthorized-domain") show("Firebase 승인된 도메인에 이 사이트 주소를 추가해 주세요");
      else if(ex&&ex.code!=="auth/popup-closed-by-user"&&ex.code!=="auth/cancelled-popup-request") show("구글 로그인이 안 돼요. 회사망에서 막혔다면 아래 이메일 로그인을 써 주세요 ("+(ex.code||"")+")");
    }
  };
  $("#lForm").onsubmit=async e=>{
    e.preventDefault();
    const em=$("#l_email").value.trim(), pw=$("#l_pw").value;
    if(!em||!pw) return show("이메일과 비밀번호를 입력해 주세요.");
    const b=$("#lGo"); b.disabled=true;
    try{ await auth.signInWithEmailAndPassword(em,pw); closeForm(); toast("로그인했어요"); }
    catch(ex){
      b.disabled=false;
      const c=ex&&ex.code||"";
      show(/invalid-credential|wrong-password|user-not-found|invalid-email/.test(c) ? "이메일 또는 비밀번호가 맞지 않아요."
         : /operation-not-allowed/.test(c) ? "Firebase에서 이메일/비밀번호 로그인이 꺼져 있어요."
         : /too-many-requests/.test(c) ? "여러 번 틀려서 잠시 막혔어요. 몇 분 뒤 다시 시도해 주세요."
         : /network/.test(c) ? "인터넷 연결 또는 회사망 차단을 확인해 주세요."
         : "로그인하지 못했어요 ("+c+")");
    }
  };
  $("#lReset").onclick=async()=>{
    const em=$("#l_email").value.trim();
    if(!em) return show("위에 이메일을 먼저 입력해 주세요.");
    try{ await auth.sendPasswordResetEmail(em); err.hidden=false; err.textContent="비밀번호 재설정 메일을 보냈어요. 메일함을 확인해 주세요."; }
    catch{ show("재설정 메일을 보내지 못했어요. 이메일을 확인해 주세요."); }
  };
  $("#l_email").focus();
}

/* ---------- 화면 전환: 방문자 = 포트폴리오 / 관리자 = 레퍼런스 아카이브 ---------- */
$("#pubLogin").addEventListener("click",()=>{ if(auth) openLogin(); });

let unsub=null;
function stopData(){
  if(unsub){ unsub(); unsub=null; }
  monsters=[]; loaded=false; groupEdit=null; closeForm(); hidePop(true);
}
function startData(){
  if(unsub) return;
  loaded=false;
  const timer=setTimeout(()=>{ if(!loaded){ showArchive(); $("#state").innerHTML="<strong>클라우드 응답이 늦어요</strong><span>인터넷 연결을 확인해 주세요.</span>"; } },10000);
  unsub=COL().onSnapshot(snap=>{
    clearTimeout(timer); loaded=true;
    monsters=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    showArchive(); render();
    if(popKey && !editing){ drawPop(false); place(); }
  }, ex=>{
    clearTimeout(timer); unsub=null;
    if(ex&&ex.code==="permission-denied"){
      /* 규칙에 없는 계정: 관리자 아님 */
      toast("관리자 계정이 아니에요. 등록된 계정으로 로그인해 주세요");
      auth.signOut();
    } else {
      showArchive();
      $("#state").innerHTML=`<strong>클라우드에서 불러오지 못했어요</strong><span>${esc(ex&&ex.message||"")}</span>`;
    }
  });
}
async function bootCloud(){
  await loadScript(FB+"firebase-app-compat.js");
  await Promise.all([loadScript(FB+"firebase-firestore-compat.js"), loadScript(FB+"firebase-auth-compat.js")]);
  firebase.initializeApp(CFG.firebase);
  fs=firebase.firestore(); auth=firebase.auth();
  mode="cloud"; applyMode();
  auth.onAuthStateChanged(u=>{
    user=u; applyMode();
    if(u){ startData(); startPortfolio(true); }
    else { stopData(); startPortfolio(false); showPublic(); }
  });
}
async function bootLocal(){
  mode="local"; applyMode();
  let saved=null;
  try{ saved=JSON.parse(localStorage.getItem(STORE_KEY)||"null"); }catch{ saved=null; }
  if(!Array.isArray(saved)){
    try{ const r=await fetch("data.json",{cache:"no-store"}); if(r.ok){ const j=await r.json(); saved=Array.isArray(j)?j:j.monsters; } }catch{}
  }
  monsters=(Array.isArray(saved)?saved:SEED).slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  try{ works=sortWorks(JSON.parse(localStorage.getItem(WORK_KEY)||"[]")||[]); profile=JSON.parse(localStorage.getItem(PROF_KEY)||"{}")||{}; }catch{ works=[]; profile={}; }
  worksLoaded=true;
  loaded=true; persist(); showArchive(); render();
}
(async()=>{
  if(fbConfigured()){
    try{ await bootCloud(); return; }
    catch(ex){ console.error(ex); toast("Firebase에 연결하지 못해 이 브라우저 저장으로 열었어요"); }
  }
  await bootLocal(); applyMode();
})();
})();
